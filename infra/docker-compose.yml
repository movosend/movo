version: "3.9"

# Sin este límite, el driver json-file (default de Docker) escribe logs sin
# tope -- en una EC2 con disco chico (ADR-006) es una de las formas más
# fáciles de repetir el "no space left on device" que ya nos pasó por
# imágenes viejas sin limpiar. 10MB x 3 archivos = 30MB máximo por
# contenedor, más que suficiente para diagnosticar un incidente reciente.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: movo
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - movo-net

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    networks:
      - movo-net

  # No hay ALB (ver movo-infra/modules/networking): el tráfico entra
  # directo a la EC2 vía Elastic IP + Cloudflare en modo DNS-only. Este
  # servicio es el que efectivamente termina TLS y reenvía a gateway:3000,
  # así que el puerto de gateway ya no necesita estar expuesto al host.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      # Certificados de Certbot, que corre en el host (no en un contenedor)
      # según movo-infra/modules/compute/templates/user_data.sh.tpl.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - gateway
    networks:
      - movo-net

  gateway:
    image: ghcr.io/movosend/gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-users:
    image: ghcr.io/movosend/movo-svc-users:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      # MOVO-71: `:-console` (no solo `-console`) es a propósito — si SMS_PROVIDER no
      # está en Secrets Manager, ${SMS_PROVIDER} se sustituye por vacío y el contenedor
      # arranca con la env var *presente pero vacía*, que no matchea el enum de
      # envSchema (AJV solo aplica su default cuando la variable está ausente, no
      # cuando está vacía) y tira el servicio abajo al boot. `:-` cubre "unset o vacío".
      - SMS_PROVIDER=${SMS_PROVIDER:-console}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_API_KEY_SID=${TWILIO_API_KEY_SID}
      - TWILIO_API_KEY_SECRET=${TWILIO_API_KEY_SECRET}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      # MOVO-71: TelegramSmsProvider, exclusivo de develop (SMS_PROVIDER=telegram) —
      # evita depender de la consola de EC2 para ver el OTP en dev.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # MOVO-72: mismo criterio de `:-mock` que SMS_PROVIDER arriba — una var presente
      # pero vacía no matchea el enum de envSchema y tira el servicio abajo al boot.
      - DIDIT_MODE=${DIDIT_MODE:-mock}
      - DIDIT_BASE_URL=${DIDIT_BASE_URL}
      - DIDIT_API_KEY=${DIDIT_API_KEY}
      - DIDIT_WORKFLOW_ID_IDENTITY=${DIDIT_WORKFLOW_ID_IDENTITY}
      # MOVO-15: workflow separado para la verificación de licencia de conducir.
      - DIDIT_WORKFLOW_ID_LICENSE=${DIDIT_WORKFLOW_ID_LICENSE}
      - DIDIT_WEBHOOK_SECRET=${DIDIT_WEBHOOK_SECRET}
      # MOVO-73: mismo criterio de `:-mock` que SMS_PROVIDER/DIDIT_MODE arriba — una var
      # presente pero vacía no matchea el enum de envSchema y tira el servicio abajo al boot.
      - GEOCODING_PROVIDER=${GEOCODING_PROVIDER:-mock}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      # Mismo criterio de `:-mock` que GEOCODING_PROVIDER arriba — una var presente pero
      # vacía no matchea el enum de envSchema y tira el servicio abajo al boot. Faltaba
      # esta línea (a diferencia de ROUTES_PROVIDER en movo-svc-shipments más abajo), por
      # lo que PLACES_PROVIDER nunca llegaba al contenedor aunque se cargara en Secrets
      # Manager. Reusa el mismo GOOGLE_MAPS_API_KEY ya declarado arriba.
      - PLACES_PROVIDER=${PLACES_PROVIDER:-mock}
      # MOVO-97: mismo criterio de `:-mock` que SMS_PROVIDER/DIDIT_MODE/GEOCODING_PROVIDER
      # arriba — una var presente pero vacía no matchea el enum de envSchema y tira el
      # servicio abajo al boot. Sin AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY a propósito:
      # las credenciales de AWS salen del IAM role de la instancia EC2 (ADR-007/015), no
      # de una env var.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-mock}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      # MOVO-106: mismo criterio de `:-mock` que STORAGE_PROVIDER/GEOCODING_PROVIDER/
      # DIDIT_MODE/SMS_PROVIDER arriba — una var presente pero vacía no matchea el enum
      # de envSchema y tira el servicio abajo al boot.
      - PUSH_PROVIDER=${PUSH_PROVIDER:-mock}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-shipments:
    image: ghcr.io/movosend/movo-svc-shipments:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      # MOVO-81: mismo bucket que movo-svc-users (movo-shipment-media-{env}), prefijo
      # shipments/* en vez de profile-photos/*. Mismo criterio de `:-mock` que el resto
      # de los STORAGE_PROVIDER/GEOCODING_PROVIDER/DIDIT_MODE del compose.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-mock}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      # MOVO-123: mismo criterio de `:-mock` que SMS_PROVIDER/DIDIT_MODE/GEOCODING_PROVIDER
      # arriba — una var presente pero vacía no matchea el enum de envSchema y tira el
      # servicio abajo al boot.
      - ROUTES_PROVIDER=${ROUTES_PROVIDER:-mock}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      # MOVO-130: expiración automática del envío no confirmado
      - RECEIVER_CONFIRMATION_TIMEOUT_HOURS=${RECEIVER_CONFIRMATION_TIMEOUT_HOURS:-48}
      - RECEIVER_CONFIRMATION_SWEEP_INTERVAL_MINUTES=${RECEIVER_CONFIRMATION_SWEEP_INTERVAL_MINUTES:-15}
      - RECEIVER_CONFIRMATION_SWEEP_ENABLED=${RECEIVER_CONFIRMATION_SWEEP_ENABLED:-true}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-payments:
    image: ghcr.io/movosend/movo-svc-payments:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-admin:
    image: ghcr.io/movosend/movo-svc-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-pricing-logistics:
    image: ghcr.io/movosend/movo-svc-pricing-logistics:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - movo-net

networks:
  movo-net:
    driver: bridge

volumes:
  postgres-data: