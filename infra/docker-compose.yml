version: "3.9"

# Sin este límite, el driver json-file (default de Docker) escribe logs sin
# tope -- en una EC2 con disco chico (ADR-006) es una de las formas más
# fáciles de repetir el "no space left on device" que ya nos pasó por
# imágenes viejas sin limpiar. 10MB x 3 archivos = 30MB máximo por
# contenedor, más que suficiente para diagnosticar un incidente reciente.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: movo
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - movo-net

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    networks:
      - movo-net

  # No hay ALB (ver movo-infra/modules/networking): el tráfico entra
  # directo a la EC2 vía Elastic IP + Cloudflare en modo DNS-only. Este
  # servicio es el que efectivamente termina TLS y reenvía a gateway:3000,
  # así que el puerto de gateway ya no necesita estar expuesto al host.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      # Certificados de Certbot, que corre en el host (no en un contenedor)
      # según movo-infra/modules/compute/templates/user_data.sh.tpl.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - gateway
    networks:
      - movo-net

  gateway:
    image: ghcr.io/movosend/gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      # Juegos de movo-institucional (/api/v1/demo/*). Vacía = /demo responde 401.
      - DEMO_API_KEYS=${DEMO_API_KEYS:-}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-users:
    image: ghcr.io/movosend/movo-svc-users:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      # MOVO-71: `:-console` (no solo `-console`) es a propósito — si SMS_PROVIDER no
      # está en Secrets Manager, ${SMS_PROVIDER} se sustituye por vacío y el contenedor
      # arranca con la env var *presente pero vacía*, que no matchea el enum de
      # envSchema (AJV solo aplica su default cuando la variable está ausente, no
      # cuando está vacía) y tira el servicio abajo al boot. `:-` cubre "unset o vacío".
      - SMS_PROVIDER=${SMS_PROVIDER:-console}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_API_KEY_SID=${TWILIO_API_KEY_SID}
      - TWILIO_API_KEY_SECRET=${TWILIO_API_KEY_SECRET}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      # MOVO-71: TelegramSmsProvider, exclusivo de develop (SMS_PROVIDER=telegram) —
      # evita depender de la consola de EC2 para ver el OTP en dev.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # MOVO-72: mismo criterio de `:-mock` que SMS_PROVIDER arriba — una var presente
      # pero vacía no matchea el enum de envSchema y tira el servicio abajo al boot.
      - DIDIT_MODE=${DIDIT_MODE:-mock}
      - DIDIT_BASE_URL=${DIDIT_BASE_URL}
      - DIDIT_API_KEY=${DIDIT_API_KEY}
      - DIDIT_WORKFLOW_ID_IDENTITY=${DIDIT_WORKFLOW_ID_IDENTITY}
      # MOVO-15: workflow separado para la verificación de licencia de conducir.
      - DIDIT_WORKFLOW_ID_LICENSE=${DIDIT_WORKFLOW_ID_LICENSE}
      - DIDIT_WEBHOOK_SECRET=${DIDIT_WEBHOOK_SECRET}
      # MOVO-73: mismo criterio de `:-mock` que SMS_PROVIDER/DIDIT_MODE arriba — una var
      # presente pero vacía no matchea el enum de envSchema y tira el servicio abajo al boot.
      - GEOCODING_PROVIDER=${GEOCODING_PROVIDER:-mock}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      # Mismo criterio de `:-mock` que GEOCODING_PROVIDER arriba — una var presente pero
      # vacía no matchea el enum de envSchema y tira el servicio abajo al boot. Faltaba
      # esta línea (a diferencia de ROUTES_PROVIDER en movo-svc-shipments más abajo), por
      # lo que PLACES_PROVIDER nunca llegaba al contenedor aunque se cargara en Secrets
      # Manager. Reusa el mismo GOOGLE_MAPS_API_KEY ya declarado arriba.
      - PLACES_PROVIDER=${PLACES_PROVIDER:-mock}
      # MOVO-97: mismo criterio de `:-mock` que SMS_PROVIDER/DIDIT_MODE/GEOCODING_PROVIDER
      # arriba — una var presente pero vacía no matchea el enum de envSchema y tira el
      # servicio abajo al boot. Sin AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY a propósito:
      # las credenciales de AWS salen del IAM role de la instancia EC2 (ADR-007/015), no
      # de una env var.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-mock}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      # MOVO-106: mismo criterio de `:-mock` que STORAGE_PROVIDER/GEOCODING_PROVIDER/
      # DIDIT_MODE/SMS_PROVIDER arriba — una var presente pero vacía no matchea el enum
      # de envSchema y tira el servicio abajo al boot.
      - PUSH_PROVIDER=${PUSH_PROVIDER:-mock}
      # MOVO-139 (ADR-017): mismo criterio de `:-console` que SMS_PROVIDER arriba -- una
      # var presente pero vacía no matchea el enum de envSchema y tira el servicio abajo
      # al boot. Faltaba todo este bloque: aunque EMAIL_PROVIDER/RESEND_API_KEY/EMAIL_FROM
      # estuvieran en Secrets Manager, compose solo pasa al contenedor lo que está listado
      # acá, así que el servicio arrancaba siempre con el ConsoleEmailProvider (loguea el
      # mail en vez de mandarlo) y nada llegaba a Resend.
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      # MOVO-152: TTL en segundos de la caché de reputación en Redis -- no es un
      # `*_PROVIDER`/enum (no hace falta `:-` para el gotcha de var vacía documentado
      # arriba), pero se lista igual para poder ajustarlo sin rebuild de imagen.
      - REPUTATION_CACHE_TTL_SECONDS=${REPUTATION_CACHE_TTL_SECONDS:-60}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-shipments:
    image: ghcr.io/movosend/movo-svc-shipments:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      # MOVO-81: mismo bucket que movo-svc-users (movo-shipment-media-{env}), prefijo
      # shipments/* en vez de profile-photos/*. Mismo criterio de `:-mock` que el resto
      # de los STORAGE_PROVIDER/GEOCODING_PROVIDER/DIDIT_MODE del compose.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-mock}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      # MOVO-123: mismo criterio de `:-mock` que SMS_PROVIDER/DIDIT_MODE/GEOCODING_PROVIDER
      # arriba — una var presente pero vacía no matchea el enum de envSchema y tira el
      # servicio abajo al boot.
      - ROUTES_PROVIDER=${ROUTES_PROVIDER:-mock}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      # MOVO-130: expiración automática del envío no confirmado
      - RECEIVER_CONFIRMATION_TIMEOUT_HOURS=${RECEIVER_CONFIRMATION_TIMEOUT_HOURS:-48}
      - RECEIVER_CONFIRMATION_SWEEP_INTERVAL_MINUTES=${RECEIVER_CONFIRMATION_SWEEP_INTERVAL_MINUTES:-15}
      - RECEIVER_CONFIRMATION_SWEEP_ENABLED=${RECEIVER_CONFIRMATION_SWEEP_ENABLED:-true}
      - RECEIVER_REDESIGNATION_TIMEOUT_HOURS=${RECEIVER_REDESIGNATION_TIMEOUT_HOURS:-48}
      # MOVO-147: constantes del score de reputación ponderado (domain/reputation.ts).
      - REPUTATION_CONFIDENCE_CONSTANT=${REPUTATION_CONFIDENCE_CONSTANT:-5}
      - REPUTATION_DECAY_HALF_LIFE_DAYS=${REPUTATION_DECAY_HALF_LIFE_DAYS:-180}
      # MOVO-161: radio de desvío ortogonal al corredor del viaje declarado (km).
      - TRIP_DEFAULT_MAX_DETOUR_KM=${TRIP_DEFAULT_MAX_DETOUR_KM:-15}
      # MOVO-143: comisión de Movo (confirmada, 15%) + fee de MercadoPago (placeholder,
      # pendiente de confirmar) -- leídas por @movo/shared, no por el envSchema propio
      # de este servicio (ver shared/movo-shared/src/config/commission.ts).
      - MOVO_COMMISSION_RATE=${MOVO_COMMISSION_RATE:-0.15}
      - MP_TRANSACTION_FEE_RATE=${MP_TRANSACTION_FEE_RATE:-0.0499}
      # Corrección sobre bug reportado: barrido que cancela envíos published con
      # retiro vencido (sin ticket propio, ver CLAUDE.md de svc-shipments).
      - PICKUP_EXPIRY_SWEEP_INTERVAL_MINUTES=${PICKUP_EXPIRY_SWEEP_INTERVAL_MINUTES:-15}
      - PICKUP_EXPIRY_SWEEP_ENABLED=${PICKUP_EXPIRY_SWEEP_ENABLED:-true}
      # MOVO-158 (AC7): liberación de fondos real de MercadoPago descopeada de este
      # ticket -- único valor hoy "console" (no-op/log), mismo criterio de `:-console`
      # que el resto de los *_PROVIDER de arriba.
      - FUNDS_RELEASE_NOTIFIER=${FUNDS_RELEASE_NOTIFIER:-console}
      # MOVO-82: el default de código (http://movo-svc-pricing-logistics:8000) ya
      # coincide con el nombre del servicio en movo-net, mismo criterio que
      # USERS_SERVICE_URL -- no hace falta setearlo acá.
      # MOVO-116: PAYMENTS_SERVICE_URL, mismo criterio -- el default de código
      # (http://movo-svc-payments:3000) ya coincide con el servicio en movo-net.
      # MOVO-202/ADR-023: retención de la traza GPS (días) y barrido de purga.
      - CARRIER_POSITION_RETENTION_DAYS=${CARRIER_POSITION_RETENTION_DAYS:-30}
      - CARRIER_POSITION_PURGE_SWEEP_INTERVAL_MINUTES=${CARRIER_POSITION_PURGE_SWEEP_INTERVAL_MINUTES:-60}
      - CARRIER_POSITION_PURGE_SWEEP_ENABLED=${CARRIER_POSITION_PURGE_SWEEP_ENABLED:-true}
      # MOVO-238: sweep de viajes `declared` vencidos sin paquetes aceptados.
      - TRIP_EXPIRY_SWEEP_INTERVAL_MINUTES=${TRIP_EXPIRY_SWEEP_INTERVAL_MINUTES:-15}
      - TRIP_EXPIRY_SWEEP_ENABLED=${TRIP_EXPIRY_SWEEP_ENABLED:-true}
      # MOVO-258: retiro no realizado (cancela envíos asignados) y en tránsito anómalo
      # (los marca para revisión).
      - PICKUP_MISSED_SWEEP_INTERVAL_MINUTES=${PICKUP_MISSED_SWEEP_INTERVAL_MINUTES:-15}
      - PICKUP_MISSED_SWEEP_ENABLED=${PICKUP_MISSED_SWEEP_ENABLED:-true}
      - PICKUP_MISSED_GRACE_HOURS=${PICKUP_MISSED_GRACE_HOURS:-24}
      - TRANSIT_ANOMALY_SWEEP_INTERVAL_MINUTES=${TRANSIT_ANOMALY_SWEEP_INTERVAL_MINUTES:-15}
      - TRANSIT_ANOMALY_SWEEP_ENABLED=${TRANSIT_ANOMALY_SWEEP_ENABLED:-true}
      - IN_TRANSIT_ANOMALY_FALLBACK_HOURS=${IN_TRANSIT_ANOMALY_FALLBACK_HOURS:-48}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-payments:
    image: ghcr.io/movosend/movo-svc-payments:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      # MOVO-267: credenciales de la app Marketplace de MP por ambiente (secret de
      # AWS Secrets Manager). Sin access token de la app: los pagos van con el
      # token OAuth de cada transportista. MP_TEST_MODE solo en sandbox (dev).
      - MP_CLIENT_ID=${MP_CLIENT_ID:-}
      - MP_CLIENT_SECRET=${MP_CLIENT_SECRET:-}
      - MP_REDIRECT_URI=${MP_REDIRECT_URI:-}
      - MP_WEBHOOK_SECRET=${MP_WEBHOOK_SECRET:-}
      # MOVO-111: key para cifrar los tokens OAuth en la base (AES-256-GCM).
      - MP_TOKEN_ENCRYPTION_KEY=${MP_TOKEN_ENCRYPTION_KEY:-}
      - MP_TEST_MODE=${MP_TEST_MODE:-false}
      # MOVO-209: plazo del hold de MP (provisorio hasta MOVO-215) y comisión de Movo,
      # esta última leída por @movo/shared; sin ella un cambio en shipments divergiría.
      - MP_HOLD_VALIDITY_DAYS=${MP_HOLD_VALIDITY_DAYS:-5}
      - MOVO_COMMISSION_RATE=${MOVO_COMMISSION_RATE:-0.15}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-admin:
    image: ghcr.io/movosend/movo-svc-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - movo-net

  movo-svc-pricing-logistics:
    image: ghcr.io/movosend/movo-svc-pricing-logistics:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # MOVO-205: proveedor de rutas (mock para desarrollo local/CI, google para staging/demo)
      - ROUTES_PROVIDER=${ROUTES_PROVIDER:-mock}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - ROUTING_TIME_LIMIT_SECONDS=${ROUTING_TIME_LIMIT_SECONDS:-1.0}
      - ROUTING_AVG_SPEED_KMH=${ROUTING_AVG_SPEED_KMH:-40.0}
      - ROUTING_TIME_SLACK_MINUTES=${ROUTING_TIME_SLACK_MINUTES:-120}
      - ROUTING_DEFAULT_SERVICE_TIME_MINUTES=${ROUTING_DEFAULT_SERVICE_TIME_MINUTES:-10}
      - ROUTING_CACHE_TTL_SECONDS=${ROUTING_CACHE_TTL_SECONDS:-86400}
      # MOVO-138/ADR-025: precio de la nafta (mock sin red; energia = API CKAN + cache Redis)
      - FUEL_PRICE_PROVIDER=${FUEL_PRICE_PROVIDER:-mock}
      - PRICING_FUEL_PRICE_FALLBACK_ARS_PER_L=${PRICING_FUEL_PRICE_FALLBACK_ARS_PER_L:-2222.5}
      - PRICING_FUEL_CACHE_TTL_SECONDS=${PRICING_FUEL_CACHE_TTL_SECONDS:-86400}
      # MOVO-138/ADR-025: coeficientes de demand_fuel_routes_v1 (en litros de nafta) y recargo por demanda
      - PRICING_BASE_FARE_L=${PRICING_BASE_FARE_L:-0.675}
      - PRICING_FUEL_L_PER_KM=${PRICING_FUEL_L_PER_KM:-0.08}
      - PRICING_FUEL_COST_SHARE=${PRICING_FUEL_COST_SHARE:-0.6}
      - PRICING_NON_FUEL_L_PER_KM=${PRICING_NON_FUEL_L_PER_KM:-0.02}
      - PRICING_PER_KG_L=${PRICING_PER_KG_L:-0.135}
      - PRICING_DEMAND_RATIO_THRESHOLD=${PRICING_DEMAND_RATIO_THRESHOLD:-3.0}
      - PRICING_DEMAND_MIN_SHIPMENTS=${PRICING_DEMAND_MIN_SHIPMENTS:-4}
      - PRICING_DEMAND_BASE_SURCHARGE=${PRICING_DEMAND_BASE_SURCHARGE:-0.10}
      - PRICING_DEMAND_SLOPE=${PRICING_DEMAND_SLOPE:-0.05}
      - PRICING_DEMAND_MAX_SURCHARGE=${PRICING_DEMAND_MAX_SURCHARGE:-0.30}
    depends_on:
      - redis
    networks:
      - movo-net

networks:
  movo-net:
    driver: bridge

volumes:
  postgres-data: