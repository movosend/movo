name: Mobile EAS Build

# Un tag de git dispara el build de movo-mobile en EAS Cloud:
#   dev-*  -> development build (profile `development`, iOS + Android)
#   v*     -> TestFlight (profile `staging`, solo iOS, con submit automático).
#             Apunta a api-dev.movosend.app: la EC2 de prod está apagada por costos.
#             Cuando se prenda, sumar un tag propio (ej. `prod-*`) con el profile
#             `production` y un guard contra main.
#
# El workflow que corre es el del commit taggeado, no el de `develop`/`main`: tiene
# que estar mergeado antes de crear el tag.
on:
  push:
    tags:
      - "v*"
      - "dev-*"

permissions:
  contents: read

# Sin cancel-in-progress: un tag de release no se debe cancelar a medias por otro tag.
concurrency:
  group: mobile-eas-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  dev-build:
    if: startsWith(github.ref_name, 'dev-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: movo-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # movo-mobile es un workspace npm del monorepo: sus deps se instalan
      # (hoisteadas) desde la raíz. `app.config.js` necesita `expo` instalado
      # para poder evaluarse cuando eas-cli lo lee.
      - name: Instalar dependencias
        working-directory: .
        run: npm ci

      # eas-cli >= 24.4.1: versiones anteriores tienen un bug con la Push Key de
      # iOS (ver movo-mobile/CLAUDE.md, MOVO-232).
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait: el job termina apenas EAS encola los builds (link en el log),
      # en vez de gastar minutos de runner esperando. El resultado real del build
      # se mira en expo.dev, no en este check.
      - name: Encolar development build (iOS + Android)
        run: |
          set -o pipefail
          eas build --platform all --profile development --non-interactive --no-wait 2>&1 | tee "$RUNNER_TEMP/eas-build.log"

      # Un aviso que falla no tiene que poner en rojo un build que sí se encoló
      # (continue-on-error), y sin los secrets de Telegram simplemente se omite.
      - name: Avisar en Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sin secrets de Telegram: se omite el aviso."
            exit 0
          fi
          links="$(grep -oE 'https://expo\.dev/accounts/[^ ]+/builds/[0-9a-f-]+' "$RUNNER_TEMP/eas-build.log" | sort -u)"
          text="$(printf 'Development build encolado (%s)\n\n%s\n\nCuando termine, abrí el link desde tu iPhone o Android para instalarlo.' "$TAG" "$links")"
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null

  testflight:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: movo-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # El guard de abajo necesita el historial de develop y main.
          fetch-depth: 0

      # TestFlight le llega a los testers: no se publica un build de un commit
      # que no pasó por revisión (una rama feature sin mergear).
      - name: Verificar que el tag está en develop o main
        working-directory: .
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop \
            && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag ${GITHUB_REF_NAME} apunta a un commit que no está en develop ni en main. Mergeá el PR antes de taggear."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        working-directory: .
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --auto-submit: EAS sube el .ipa a App Store Connect apenas termina el
      # build (el número de build lo incrementa `autoIncrement` de eas.json).
      - name: Encolar build de staging + submit a TestFlight
        run: |
          set -o pipefail
          eas build --platform ios --profile staging --non-interactive --no-wait --auto-submit 2>&1 | tee "$RUNNER_TEMP/eas-build.log"

      - name: Avisar en Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sin secrets de Telegram: se omite el aviso."
            exit 0
          fi
          links="$(grep -oE 'https://expo\.dev/accounts/[^ ]+/builds/[0-9a-f-]+' "$RUNNER_TEMP/eas-build.log" | sort -u)"
          text="$(printf 'Build de TestFlight encolado (%s)\n\n%s\n\nCuando EAS termine, Apple lo procesa unos 10 minutos y llega a TestFlight.' "$TAG" "$links")"
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null
