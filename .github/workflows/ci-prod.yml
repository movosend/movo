name: CI Prod

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_TAG: prod

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      svc-users: ${{ steps.filter.outputs.svc-users }}
      svc-shipments: ${{ steps.filter.outputs.svc-shipments }}
      svc-payments: ${{ steps.filter.outputs.svc-payments }}
      svc-admin: ${{ steps.filter.outputs.svc-admin }}
      svc-pricing-logistics: ${{ steps.filter.outputs.svc-pricing-logistics }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'gateway/**'
              - 'shared/**'
            svc-users:
              - 'services/movo-svc-users/**'
              - 'shared/**'
            svc-shipments:
              - 'services/movo-svc-shipments/**'
              - 'shared/**'
            svc-payments:
              - 'services/movo-svc-payments/**'
              - 'shared/**'
            svc-admin:
              - 'services/movo-svc-admin/**'
              - 'shared/**'
            svc-pricing-logistics:
              - 'services/movo-svc-pricing-logistics/**'

  node-services:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.gateway == 'true' ||
      needs.detect-changes.outputs.svc-users == 'true' ||
      needs.detect-changes.outputs.svc-shipments == 'true' ||
      needs.detect-changes.outputs.svc-payments == 'true' ||
      needs.detect-changes.outputs.svc-admin == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo_ci_pw
          POSTGRES_DB: movo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://movo:movo_ci_pw@localhost:5432/movo
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret_do_not_use_in_prod
      PORT: 3000

    strategy:
      fail-fast: false
      matrix:
        service:
          - {
              name: gateway,
              path: gateway,
              changed: "${{ needs.detect-changes.outputs.gateway }}",
            }
          - {
              name: movo-svc-users,
              path: services/movo-svc-users,
              changed: "${{ needs.detect-changes.outputs.svc-users }}",
            }
          - {
              name: movo-svc-shipments,
              path: services/movo-svc-shipments,
              changed: "${{ needs.detect-changes.outputs.svc-shipments }}",
            }
          - {
              name: movo-svc-payments,
              path: services/movo-svc-payments,
              changed: "${{ needs.detect-changes.outputs.svc-payments }}",
            }
          - {
              name: movo-svc-admin,
              path: services/movo-svc-admin,
              changed: "${{ needs.detect-changes.outputs.svc-admin }}",
            }
    steps:
      - uses: actions/checkout@v4
        if: matrix.service.changed == 'true'

      - uses: actions/setup-node@v4
        if: matrix.service.changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        if: matrix.service.changed == 'true'
        run: npm ci

      - name: Build shared package
        if: matrix.service.changed == 'true'
        run: npm run build -w @movo/shared

      - name: Lint (ESLint)
        if: matrix.service.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        if: matrix.service.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        run: npx tsc --noEmit

      # movo-svc-users y movo-svc-shipments usan Prisma Migrate (prisma migrate
      # deploy, con tracking propio en _prisma_migrations) -- los demás
      # servicios siguen con el runner de SQL a mano hasta que tengan dominio
      # real (ver ADR-011; movo-svc-shipments lo adoptó en MOVO-104).
      - name: Run migrations (Prisma)
        if: |
          matrix.service.changed == 'true' &&
          (matrix.service.name == 'movo-svc-users' || matrix.service.name == 'movo-svc-shipments')
        working-directory: ${{ matrix.service.path }}
        run: npx prisma migrate deploy

      - name: Run migrations (SQL)
        if: |
          matrix.service.changed == 'true' &&
          matrix.service.name != 'gateway' &&
          matrix.service.name != 'movo-svc-users' &&
          matrix.service.name != 'movo-svc-shipments'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          ./scripts/run-migrations.sh ${{ matrix.service.path }}

      - name: Tests
        if: matrix.service.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        run: npm test

      - name: Login a GHCR
        if: matrix.service.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        if: matrix.service.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/movosend/${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/movosend/${{ matrix.service.name }}:${{ github.sha }}

  python-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.svc-pricing-logistics == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/movo-svc-pricing-logistics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy .

      - name: Tests
        run: pytest

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: services/movo-svc-pricing-logistics
          push: true
          tags: |
            ${{ env.REGISTRY }}/movosend/movo-svc-pricing-logistics:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/movosend/movo-svc-pricing-logistics:${{ github.sha }}

  deploy-prod:
    needs: [detect-changes, node-services, python-service]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: sa-east-1
      SECRETS_MANAGER_ID: movo/prod/app-secrets
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Genera el .env que docker-compose.yml necesita a partir del secret
      # de Secrets Manager (fuente de verdad de los secretos de la app) +
      # IMAGE_TAG, que no es un secreto sino que lo fija este workflow.
      - name: Generar .env desde Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "${{ env.SECRETS_MANAGER_ID }}" \
            --query SecretString --output text \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> .env

          # La password de DATABASE_URL sale de Secrets Manager sin percent-encodear.
          # node-postgres (pg, usado por svc-shipments/payments/admin) tolera
          # caracteres reservados de RFC 3986 sin escapar en el connection string,
          # pero el parser de Prisma (movo-svc-users, `prisma migrate deploy`) no --
          # falla con "P1013: invalid port number" si la password trae '/', '#', '%',
          # etc. sin encodear. Se reescribe DATABASE_URL con user/password
          # percent-encodeados; pg también soporta la forma encodeada, así que es
          # seguro para el resto de los servicios.
          # (.+) codicioso antes del @ final -- no [^@]+ -- porque la password
          # puede contener '@' (como en prod): [^@]+ corta en el PRIMER @ que
          # encuentra, aunque esté adentro de la password, y deja un pedazo de
          # la password mezclado con el host real ("Error: P1013"/host
          # inválido). El regex greedy hace backtrack hasta el ÚLTIMO @, que
          # es el separador real -- mismo criterio que usa el parser de `pg`.
          db_url="$(grep '^DATABASE_URL=' .env | cut -d= -f2-)"
          if [[ "$db_url" =~ ^(postgres(ql)?://)([^:@/]+):(.+)@([^@]+)$ ]]; then
            scheme="${BASH_REMATCH[1]}"
            user="${BASH_REMATCH[3]}"
            pass="${BASH_REMATCH[4]}"
            rest="${BASH_REMATCH[5]}"
            enc_user="$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$user")"
            enc_pass="$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$pass")"
            new_url="${scheme}${enc_user}:${enc_pass}@${rest}"
            tmp="$(mktemp)"
            grep -v '^DATABASE_URL=' .env > "$tmp"
            echo "DATABASE_URL=${new_url}" >> "$tmp"
            # mktemp crea el archivo con permisos 600 -- el mv pisa los 644
            # que tenía .env, y el contenedor de appleboy/scp-action no puede
            # leerlo para armar el tar ("tar: can't open '.env': Permission
            # denied").
            chmod 644 "$tmp"
            mv "$tmp" .env
          fi

      # Docker crea los directorios de los bind mounts (ver docker-compose.yml)
      # como root si no existen todavía, lo que rompe el scp/tar de los pasos
      # siguientes (corren como el usuario ssh, no root).
      - name: Asegurar permisos de ~/movo en la EC2 de prod
        uses: appleboy/ssh-action@v1
        with:
          host: api.movosend.app
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/movo
            sudo chown -R "$(whoami)":"$(whoami)" ~/movo

      - name: Copiar docker-compose.yml a la EC2 de prod
        uses: appleboy/scp-action@v0.1.7
        with:
          host: api.movosend.app
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/docker-compose.yml"
          target: "~/movo"
          strip_components: 1

      - name: Copiar templates de nginx a la EC2 de prod
        uses: appleboy/scp-action@v0.1.7
        with:
          host: api.movosend.app
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/nginx"
          target: "~/movo"
          strip_components: 1

      - name: Copiar .env a la EC2 de prod
        uses: appleboy/scp-action@v0.1.7
        with:
          host: api.movosend.app
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env"
          target: "~/movo"

      - name: Copiar script y migraciones a la EC2 de prod
        uses: appleboy/scp-action@v0.1.7
        with:
          host: api.movosend.app
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "scripts/run-migrations.sh,services/movo-svc-payments/migrations,services/movo-svc-admin/migrations"
          target: "~/movo"

      # Postgres no expone puerto público en la EC2 (ADR-010): se migra via
      # docker exec dentro del propio contenedor, igual que hace
      # scripts/run-migrations.sh cuando no encuentra psql en el host. Corre
      # antes de levantar las imágenes nuevas de la app para que ningún
      # contenedor arranque contra un schema desactualizado. El ledger
      # schema_migrations evita reaplicar lo que ya corrió en un deploy
      # anterior. movo-svc-users y movo-svc-shipments usan Prisma Migrate
      # (ADR-011, MOVO-104): la imagen ya trae la CLI + prisma/migrations (ver
      # Dockerfile), por eso no entran en el for de run-migrations.sh -- se
      # migran aparte con `prisma migrate deploy`, pero primero hay que traer
      # la imagen nueva (docker compose pull), porque `docker compose run` no
      # repushea una imagen ya presente localmente con el mismo tag.
      - name: Aplicar migraciones de base de datos en prod
        uses: appleboy/ssh-action@v1
        with:
          host: api.movosend.app
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_PAT
          script: |
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/movo
            set -a
            while IFS='=' read -r key value; do
              [ -z "$key" ] && continue
              case "$key" in \#*) continue ;; esac
              export "$key=$value"
            done < .env
            set +a
            chmod +x scripts/run-migrations.sh
            docker compose up -d postgres
            echo "Esperando a que Postgres esté listo..."
            until docker exec "$(docker ps --filter name=postgres --format '{{.Names}}' | head -n1)" pg_isready -U "${POSTGRES_USER:-movo}" > /dev/null 2>&1; do
              sleep 2
            done
            for svc in services/movo-svc-payments services/movo-svc-admin; do
              ./scripts/run-migrations.sh "$svc"
            done
            docker compose pull movo-svc-users movo-svc-shipments
            docker compose run --rm -T movo-svc-users npx prisma migrate deploy
            docker compose run --rm -T movo-svc-shipments npx prisma migrate deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Pull de imágenes nuevas y restart de contenedores
        uses: appleboy/ssh-action@v1
        with:
          host: api.movosend.app
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_PAT
          script: |
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/movo
            docker compose pull
            docker compose up -d --remove-orphans
            # nginx resuelve el hostname "gateway" (y el resto de los
            # servicios) una sola vez al arrancar el worker y no vuelve a
            # hacerlo. up -d recrea los contenedores de la app con IPs
            # nuevas en la red de Docker, pero no toca `proxy` (su imagen
            # no cambió), así que se queda con la IP vieja cacheada y
            # termina reenviando tráfico a lo que sea que Docker le haya
            # asignado esa IP después. Reiniciarlo fuerza una resolución
            # DNS nueva.
            docker compose restart proxy
            # Cada deploy deja la imagen anterior de cada servicio como
            # dangling (el tag ":prod" se mueve a la nueva) -- sin este paso
            # se acumulan sin límite y terminan llenando el disco de la EC2
            # (pasó acá: "no space left on device" a mitad de un pull, dejó
            # a movo-svc-users y a proxy sin poder recrearse). Corre después
            # de que los contenedores nuevos ya están arriba, así solo borra
            # imágenes que ya nadie usa. Sin --volumes: nunca toca volúmenes
            # (ahí vive la data de Postgres).
            docker image prune -af
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
