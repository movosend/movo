name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main

# Un push nuevo a la misma PR cancela el run anterior: sin esto quedan varios
# runs de la misma rama corriendo en paralelo y compitiendo por runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      svc-users: ${{ steps.filter.outputs.svc-users }}
      svc-shipments: ${{ steps.filter.outputs.svc-shipments }}
      svc-payments: ${{ steps.filter.outputs.svc-payments }}
      svc-admin: ${{ steps.filter.outputs.svc-admin }}
      svc-pricing-logistics: ${{ steps.filter.outputs.svc-pricing-logistics }}
      mobile: ${{ steps.filter.outputs.mobile }}
      admin-web: ${{ steps.filter.outputs.admin-web }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'gateway/**'
              - 'shared/**'
            svc-users:
              - 'services/movo-svc-users/**'
              - 'shared/**'
            svc-shipments:
              - 'services/movo-svc-shipments/**'
              - 'shared/**'
            svc-payments:
              - 'services/movo-svc-payments/**'
              - 'shared/**'
            svc-admin:
              - 'services/movo-svc-admin/**'
              - 'shared/**'
            svc-pricing-logistics:
              - 'services/movo-svc-pricing-logistics/**'
            mobile:
              - 'movo-mobile/**'
            admin-web:
              - 'movo-admin/**'

  node-services:
    needs: detect-changes

    if: |
      needs.detect-changes.outputs.gateway == 'true' ||
      needs.detect-changes.outputs.svc-users == 'true' ||
      needs.detect-changes.outputs.svc-shipments == 'true' ||
      needs.detect-changes.outputs.svc-payments == 'true' ||
      needs.detect-changes.outputs.svc-admin == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo_ci_pw
          POSTGRES_DB: movo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://movo:movo_ci_pw@localhost:5432/movo
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret_do_not_use_in_prod
      PORT: 3000

    strategy:
      fail-fast: false

      matrix:
        service:
          - {
              name: gateway,
              path: gateway,
              changed: "${{ needs.detect-changes.outputs.gateway }}",
            }
          - {
              name: movo-svc-users,
              path: services/movo-svc-users,
              changed: "${{ needs.detect-changes.outputs.svc-users }}",
            }
          - {
              name: movo-svc-shipments,
              path: services/movo-svc-shipments,
              changed: "${{ needs.detect-changes.outputs.svc-shipments }}",
            }
          - {
              name: movo-svc-payments,
              path: services/movo-svc-payments,
              changed: "${{ needs.detect-changes.outputs.svc-payments }}",
            }
          - {
              name: movo-svc-admin,
              path: services/movo-svc-admin,
              changed: "${{ needs.detect-changes.outputs.svc-admin }}",
            }

    steps:
      - uses: actions/checkout@v4
        if: matrix.service.changed == 'true'

      - uses: actions/setup-node@v4
        if: matrix.service.changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        if: matrix.service.changed == 'true'
        run: npm ci

      - name: Build @movo/shared
        if: matrix.service.changed == 'true'
        working-directory: shared/movo-shared
        run: npm run build

      - name: Lint
        if: matrix.service.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        run: npm run lint

      - name: Type Check
        if: matrix.service.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        run: npx tsc --noEmit

      # movo-svc-users y movo-svc-shipments usan Prisma Migrate (prisma migrate
      # deploy, con tracking propio en _prisma_migrations) -- los demás
      # servicios siguen con el runner de SQL a mano hasta que tengan dominio
      # real (ver ADR-011; movo-svc-shipments lo adoptó en MOVO-104).
      - name: Run migrations (Prisma)
        if: |
          matrix.service.changed == 'true' &&
          (matrix.service.name == 'movo-svc-users' || matrix.service.name == 'movo-svc-shipments')
        working-directory: ${{ matrix.service.path }}
        run: npx prisma migrate deploy

      - name: Run migrations (SQL)
        if: |
          matrix.service.changed == 'true' &&
          matrix.service.name != 'gateway' &&
          matrix.service.name != 'movo-svc-users' &&
          matrix.service.name != 'movo-svc-shipments'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          ./scripts/run-migrations.sh ${{ matrix.service.path }}

      - name: Tests
        if: matrix.service.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        run: npm test

  mobile:
    needs: detect-changes

    if: needs.detect-changes.outputs.mobile == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # movo-mobile es un workspace npm del monorepo: no tiene package-lock
      # propio y sus deps se instalan (hoisteadas) desde la raíz.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Los tests importan @movo/shared por subpath de dist/ (ver
      # movo-mobile/src/api/http-client.ts) -- sin este build no resuelven.
      - name: Build @movo/shared
        working-directory: shared/movo-shared
        run: npm run build

      - name: Tests
        working-directory: movo-mobile
        run: npm test

  admin-web:
    needs: detect-changes

    if: needs.detect-changes.outputs.admin-web == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: movo-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: movo-admin/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

  python-service:
    needs: detect-changes

    if: needs.detect-changes.outputs.svc-pricing-logistics == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/movo-svc-pricing-logistics

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type Check
        run: mypy .

      - name: Tests
        run: pytest

  tests-summary:
    if: always()
    needs: [node-services, python-service, mobile, admin-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar que todos los jobs de test pasaron
        run: |
          for result in \
            "${{ needs.node-services.result }}" \
            "${{ needs.python-service.result }}" \
            "${{ needs.mobile.result }}" \
            "${{ needs.admin-web.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Un job de tests falló: $result"
              exit 1
            fi
          done
          echo "Todos los jobs de tests pasaron (o no aplicaban)."
