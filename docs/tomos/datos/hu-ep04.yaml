# EP-04 · Ejecución del Envío: historias, secuencias y casos de prueba.
historias:
  - id: MOVO-6
    nombre: Handshake criptográfico de retiro y entrega
    secuencias:
      - {id: seq-handshake, titulo: "Handshake criptográfico: generación del QR y confirmación con firma y proximidad (MOVO-6, MOVO-157 a MOVO-160)."}
    nota: |
      **Decisión de diseño (ADR-018).** El cedente (emisor en el retiro, transportista en la entrega) genera un desafío con un nonce aleatorio que vive 15 segundos en Redis y lo firma en su dispositivo con ECDSA P-256; el cesionario escanea el QR y el backend verifica la firma contra la clave pública registrada del cedente, exige que ambos estén a 100 m o menos y recién entonces transiciona el envío y registra un evento inmutable con el hash del nonce. Un nonce nuevo invalida al anterior y la confirmación es un compare-and-swap en Postgres, de modo que dos confirmaciones concurrentes con el mismo nonce no pueden ganar ambas.
    casos:
      - {ac: "1, 3, 4, 7, 8", titulo: "Retiro exitoso", pre: "Envío assigned, emisor con clave de dispositivo registrada y foto de evidencia confirmada.", pasos: "El emisor genera el QR de retiro; el transportista lo confirma con la firma y su posición.", esperado: "El envío pasa a in_transit y se persiste el evento con nonceHash, coordenadas y distancia.", test: services/movo-svc-shipments/test/handshake.integration.test.ts}
      - {ac: "4, 8", titulo: "Entrega exitosa y liberación de fondos", pre: "Envío in_transit con foto de evidencia de entrega.", pasos: "El transportista genera el QR de entrega; el receptor lo confirma.", esperado: "El envío pasa a delivered y se notifica a svc-payments la liberación del pago.", test: services/movo-svc-shipments/test/handshake.integration.test.ts}
      - {ac: "-", titulo: "Solo la parte que corresponde actúa", pre: "Envío en retiro o en entrega.", pasos: "Generar o confirmar con un usuario que no es el cedente o el cesionario de la etapa.", esperado: "403 AUTH_FORBIDDEN; un ajeno al envío recibe 403 y un envío inexistente 404.", test: [services/movo-svc-shipments/test/handshake.integration.test.ts, services/movo-svc-shipments/test/handshake-service.test.ts]}
      - {ac: "-", titulo: "Estados y plazo de retiro", pre: "Envío published, o con la ventana de retiro vencida más la gracia del barrido.", pasos: "POST /shipments/:id/handshake/generate.", esperado: "409 HANDSHAKE_INVALID_SHIPMENT_STATE para estados distintos de assigned e in_transit; 409 HANDSHAKE_PICKUP_DEADLINE_PASSED con el plazo vencido.", test: [services/movo-svc-shipments/test/handshake.integration.test.ts, services/movo-svc-shipments/test/handshake-service.test.ts]}
      - {ac: "2, 6", titulo: "QR vencido o reemplazado", pre: "Un QR de más de 15 s, o uno nuevo generado después.", pasos: "Confirmar con el nonce viejo; generar un nuevo QR.", esperado: "410 HANDSHAKE_QR_EXPIRED; el cedente puede generar un QR nuevo, que invalida el anterior.", test: [services/movo-svc-shipments/test/handshake.integration.test.ts, services/movo-svc-shipments/test/handshake-service.test.ts]}
      - {ac: "3", titulo: "Firma inválida", pre: "Desafío vigente.", pasos: "Confirmar con una firma errónea, de otro payload, de otra clave, corrupta, o con una clave pública malformada.", esperado: "422 HANDSHAKE_INVALID_SIGNATURE sin lanzar 500; el payload incluye la etapa para evitar replay entre retiro y entrega.", test: [services/movo-svc-shipments/test/handshake.integration.test.ts, services/movo-svc-shipments/test/handshake-crypto.test.ts]}
      - {ac: "3, 5", titulo: "Distancia mayor a 100 m", pre: "Transportista a más de 100 m del emisor.", pasos: "Confirmar el retiro.", esperado: "422 HANDSHAKE_DISTANCE_EXCEEDED con mensaje que indica la distancia; el intento es reintentable dentro del mismo TTL.", test: [services/movo-svc-shipments/test/handshake.integration.test.ts, services/movo-svc-shipments/test/geo.test.ts]}
      - {ac: "3", titulo: "Cedente sin clave de dispositivo", pre: "Usuario sin clave pública registrada.", pasos: "Confirmar un handshake que generó ese usuario.", esperado: "409 HANDSHAKE_CEDENTE_KEY_MISSING. La clave se registra con POST /users/me/device-key y una clave nueva reemplaza a la anterior (una sola vigente por usuario).", test: [services/movo-svc-shipments/test/handshake.integration.test.ts, services/movo-svc-users/test/users.device-key.integration.test.ts]}
      - {ac: "7", titulo: "Confirmaciones concurrentes", pre: "Desafío vigente.", pasos: "Dos confirmaciones simultáneas con el mismo nonce.", esperado: "Exactamente una gana; la otra recibe error y no duplica el evento.", test: services/movo-svc-shipments/test/handshake.integration.test.ts}
      - {ac: "-", titulo: "Evidencia fotográfica obligatoria (MOVO-21)", pre: "Etapa sin fotos de evidencia confirmadas, o con una foto solo presignada.", pasos: "Confirmar el retiro o la entrega.", esperado: "422 PICKUP_EVIDENCE_MISSING o DELIVERY_EVIDENCE_MISSING; el nonce no se consume y el intento se reintenta apenas exista la evidencia.", test: services/movo-svc-shipments/test/handshake.integration.test.ts}

  - id: MOVO-10
    nombre: Mapa de ruta optimizada multi-parada
    secuencias:
      - {id: seq-ruta-viaje, titulo: "Ruta optimizada del viaje activo con paradas ordenadas y ETA (MOVO-10, MOVO-206, MOVO-235)."}
    nota: |
      **Decisión de diseño.** La ruta la calcula `movo-svc-pricing-logistics` como un VRPTW con Google OR-Tools, con matriz de tiempos de Google Routes API (ADR-015). Si el optimizador no responde, `movo-svc-shipments` degrada a una ruta heurística sin optimizar en lugar de dejar al transportista sin mapa. Todo paquete ejecutable aporta al menos una parada (invariante de MOVO-277).
    casos:
      - {ac: "2, 3, 7", titulo: "Ruta del transportista", pre: "Transportista con envíos assigned e in_transit.", pasos: "GET /shipments/my-route con su ubicación.", esperado: "200 con las paradas ordenadas, ETA, polyline, distancia y duración; la fecha de retiro se combina con la hora en huso UTC-3.", test: [services/movo-svc-shipments/test/shipments-my-route.routes.test.ts, services/movo-svc-shipments/test/shipments-my-route.service.test.ts, services/movo-svc-shipments/test/carrier-route.test.ts]}
      - {ac: "5", titulo: "Paradas por tipo de envío", pre: "Envíos en assigned y en in_transit, solos y combinados.", pasos: "Agregar las paradas.", esperado: "Un assigned aporta retiro y entrega; un in_transit solo entrega; se combinan varios envíos y todo paquete aporta al menos una parada.", test: services/movo-svc-shipments/test/carrier-route.test.ts}
      - {ac: "-", titulo: "Parámetros y autenticación", pre: "Pedido sin identidad, sin coordenadas, con latitud inválida o con un carrierId en el query.", pasos: "GET /shipments/my-route.", esperado: "401 AUTH_REQUIRED; 400 VALIDATION_FAILED; el carrierId del query se ignora y se usa el del header.", test: services/movo-svc-shipments/test/shipments-my-route.routes.test.ts}
      - {ac: "10", titulo: "Viaje no iniciado", pre: "tripId de un viaje en declared o ya finalizado.", pasos: "GET /shipments/my-route?tripId=…", esperado: "409 TRIP_NOT_ACTIVE; con un viaje ajeno, 403; inexistente, 404.", test: services/movo-svc-shipments/test/shipments-my-route.service.test.ts}
      - {ac: "10", titulo: "Degradación si el optimizador falla", pre: "svc-pricing-logistics caído.", pasos: "GET /shipments/my-route.", esperado: "200 con una ruta degradada que conserva todas las paradas; sin paradas, ruta vacía.", test: services/movo-svc-shipments/test/shipments-my-route.service.test.ts}
      - {ac: "3", titulo: "Polyline de un trayecto", pre: "Origen y destino.", pasos: "GET /shipments/route.", esperado: "Devuelve polyline, distancia y duración; 401 sin autenticación y 400 con parámetros incompletos.", test: services/movo-svc-shipments/test/shipments-route.test.ts}
      - {ac: "2", titulo: "Motor de optimización", pre: "Conjunto de paradas con ventanas horarias.", pasos: "POST /optimize/route.", esperado: "Devuelve el orden óptimo que respeta las ventanas y usa la matriz de tiempos.", test: [services/movo-svc-pricing-logistics/tests/test_optimize.py, services/movo-svc-pricing-logistics/tests/test_evaluate.py]}

  - id: MOVO-11
    nombre: Seguimiento en tiempo real del transportista
    secuencias:
      - {id: seq-tracking, titulo: "Reporte de posición y seguimiento en vivo por WebSocket (MOVO-11, MOVO-202, MOVO-251)."}
    nota: |
      **Decisión de diseño (ADR-019).** El canal usa WebSocket nativo sobre Fastify (no Socket.io), autenticado con el JWT en el handshake y con cierre por código (4001 token, 4003 acceso, 4004 inexistente, 4009 envío terminado). La última posición conocida vive en Redis para que un suscriptor nuevo vea el mapa de inmediato, y solo se persiste una fila cada cierto intervalo para acotar el almacenamiento. La historia no tiene criterios de aceptación en Linear; el alcance quedó en sus tickets hijos.
    casos:
      - {ac: "-", titulo: "Reporte de posición del transportista", pre: "Envío in_transit y transportista asignado.", pasos: "POST /shipments/:id/positions con lat, lng y capturedAt.", esperado: "202; se actualiza la última posición en Redis y se persiste la fila; reportes seguidos descartan la persistencia salvo el primero.", test: [services/movo-svc-shipments/test/positions-report.integration.test.ts, services/movo-svc-shipments/test/position-service.test.ts]}
      - {ac: "-", titulo: "Solo el transportista reporta", pre: "Emisor, receptor y transportista.", pasos: "Reportar posición con cada uno, sin identidad, y sobre un envío inexistente.", esperado: "403 para emisor y receptor; 401 sin identidad; 404 inexistente; 403 SHIPMENT_NOT_TRACKABLE si el estado no admite tracking.", test: services/movo-svc-shipments/test/positions-report.integration.test.ts}
      - {ac: "-", titulo: "Validación de coordenadas y fechas", pre: "Pedido con lat o lng fuera de rango o capturedAt no parseable.", pasos: "POST /shipments/:id/positions.", esperado: "400; la operación figura en el Swagger generado.", test: services/movo-svc-shipments/test/positions-report.integration.test.ts}
      - {ac: "-", titulo: "Viaje con varios paquetes", pre: "Viaje mixto con un envío in_transit y otro assigned, y un envío assigned con el viaje todavía declared.", pasos: "Reportar la posición del viaje en cada caso.", esperado: "La fila se asocia al envío in_transit; con un envío assigned y el viaje active se responde 202 sin guardar traza; con el viaje declared, 403 SHIPMENT_NOT_TRACKABLE.", test: services/movo-svc-shipments/test/positions-report.integration.test.ts}
      - {ac: "-", titulo: "Conexión WebSocket autenticada", pre: "Token válido, ajeno, ausente o malformado; envío inexistente.", pasos: "Abrir /shipments/:id/track.", esperado: "Acepta al emisor, receptor y transportista asignado; cierra con 4003 para un ajeno, 4001 sin token o malformado y 4004 si no existe.", test: services/movo-svc-shipments/test/tracking.integration.test.ts}
      - {ac: "-", titulo: "Última posición y cierre al terminar", pre: "Última posición conocida en Redis.", pasos: "Conectar un suscriptor; entregar el envío.", esperado: "El suscriptor recibe la última posición al conectar; al entregarse el envío (por el handshake real) recibe el estado final y la conexión se cierra con 4009; un envío ya entregado rechaza la conexión.", test: services/movo-svc-shipments/test/tracking.integration.test.ts}
      - {ac: "-", titulo: "Registro de conexiones y purga", pre: "Conexiones abiertas y posiciones antiguas.", pasos: "Registrar y cerrar conexiones; correr el barrido de purga.", esperado: "El registro lleva las conexiones por envío; el barrido purga las posiciones más viejas que la retención configurada, con lock en Redis para que corra una sola réplica.", test: [services/movo-svc-shipments/test/realtime-registry.test.ts, services/movo-svc-shipments/test/carrier-position-purge-sweep.test.ts, services/movo-svc-shipments/test/position-repository.integration.test.ts]}

  - id: MOVO-21
    nombre: Evidencia fotográfica en retiro y entrega
    nota: |
      **Decisión de diseño (ADR-007).** Las fotos viajan directo de la app a S3 con URLs prefirmadas y no son públicas: se leen con URLs de lectura temporales y solo las ven las partes y el administrador. El handshake no avanza sin al menos una foto confirmada de la etapa.
    casos:
      - {ac: "1, 2, 4", titulo: "El handshake exige la evidencia", pre: "Etapa de retiro o de entrega sin foto confirmada.", pasos: "Consultar el estado de la evidencia y confirmar el handshake.", esperado: "En assigned la etapa es pickup y en in_transit es delivery, con satisfied=false sin evidencia y true con ella; la confirmación se rechaza hasta que exista.", test: services/movo-svc-shipments/test/handshake.integration.test.ts}
      - {ac: "1, 2", titulo: "Subida de fotos por etapa", pre: "Transportista asignado.", pasos: "Presignar, subir y confirmar fotos de pickup y de delivery; probar con un transportista no asignado.", esperado: "El transportista asignado puede registrarlas; uno no asignado recibe 403; se aceptan hasta 5 fotos por etapa y la sexta responde 422 PHOTO_STAGE_LIMIT_EXCEEDED.", test: services/movo-svc-shipments/test/photos.integration.test.ts}
      - {ac: "5", titulo: "Acceso restringido", pre: "Fotos del envío.", pasos: "Listarlas como emisor, receptor, admin, transportista asignado, transportista rechazado y tercero.", esperado: "Las partes y el admin las ven con URLs de lectura temporales; transportista rechazado y terceros reciben 403.", test: services/movo-svc-shipments/test/photos.integration.test.ts}
      - {ac: "3", titulo: "Confirmación idempotente y huérfanas", pre: "Foto subida o presignada sin confirmar.", pasos: "Confirmar dos veces la misma clave; correr el barrido de huérfanas.", esperado: "No se duplica la fila; confirmar un objeto inexistente responde 422; el barrido elimina las fotos nunca confirmadas.", test: [services/movo-svc-shipments/test/photos.integration.test.ts, services/movo-svc-shipments/test/orphan-photo-sweep.test.ts]}

  - id: MOVO-24
    nombre: Notificaciones push en los eventos del envío
    secuencias:
      - {id: seq-notificaciones, titulo: "Envío de una push respetando las preferencias del usuario (MOVO-24, MOVO-239, MOVO-245)."}
    nota: |
      **Alcance final.** La historia no tiene criterios de aceptación en Linear. Las notificaciones salen de `svc-users` a través de Expo, y cualquier servicio las dispara con `POST /internal/notifications/push`. Cada push declara una categoría del catálogo compartido (12 categorías); un servicio emisor falla en modo best-effort y nunca bloquea la operación que la origina. Las categorías con `quietHoursExempt` (proximidad y seguridad de la cuenta) ignoran el horario de silencio.
    casos:
      - {ac: "-", titulo: "Envío a todos los dispositivos del usuario", pre: "Usuario con 0, 1 o N tokens registrados.", pasos: "POST /internal/notifications/push.", esperado: "204 sin envío si no hay tokens; con uno o N tokens se envía a todos y un token que falla no aborta al resto.", test: services/movo-svc-users/test/notifications.push.integration.test.ts}
      - {ac: "-", titulo: "Categoría obligatoria y no pública", pre: "Pedido sin categoría o con una categoría desconocida.", pasos: "POST /internal/notifications/push.", esperado: "400 sin category; una categoría desconocida nunca se envía; el endpoint no figura en el Swagger público.", test: services/movo-svc-users/test/notifications.push.integration.test.ts}
      - {ac: "-", titulo: "Eventos que disparan una push", pre: "Evento de negocio (oferta, retiro, entrega, KYC, seguridad de la cuenta).", pasos: "Disparar el evento en el servicio origen.", esperado: "Se llama a /internal/notifications/push con el copy y la categoría del trigger; un fallo del envío se registra como warn y no rompe la operación.", test: [services/movo-svc-shipments/test/notifications-client.test.ts, services/movo-svc-users/test/send-trigger-push.test.ts, services/movo-svc-users/test/kyc.push.test.ts, services/movo-svc-users/test/account-security.push.test.ts]}

