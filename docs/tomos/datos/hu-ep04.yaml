      - {ac: "1, 4", titulo: "Toggle maestro persistente", pre: "Usuario autenticado.", pasos: "Apagar el toggle maestro y consultar en una request nueva.", esperado: "La preferencia persiste en el servidor y ninguna push se envía, sin importar las categorías.", test: [services/movo-svc-users/test/notification-preferences.integration.test.ts, services/movo-svc-users/test/notifications.push.integration.test.ts]}
