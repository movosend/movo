  - id: MOVO-240
    nombre: Catálogo de notificaciones faltantes
    nota: |
      **Estado.** Historia en *Por hacer*. Es el catálogo ampliado de notificaciones: varias categorías ya se implementaron como parte de otras historias (ver MOVO-24 y MOVO-245), por lo que lo pendiente es completar los triggers que aún no tienen un `sendPush` real. Los casos de prueba se definirán junto con cada trigger.
    casos:
      - {ac: "-", titulo: "Trigger sin implementar", pre: "Categoría del catálogo con implemented=false.", pasos: "Intentar enviar una push de esa categoría.", esperado: "La categoría desconocida o no implementada nunca se envía.", test: services/movo-svc-users/test/notifications.push.integration.test.ts, resultado: Pendiente}

  - id: MOVO-26
    nombre: Chat en tiempo real entre las partes
    secuencias:
      - {id: seq-chat, titulo: "Conexión, envío de mensajes y lectura del chat del envío (MOVO-26)."}
    nota: |
      **Decisión de diseño.** El chat existe mientras el envío tiene transportista asignado y se cierra de inmediato si el envío se cancela o el receptor lo rechaza. Un bloqueo (DD-026) no impide escribir: a quien tiene el bloqueo con el autor el mensaje le llega vacío y marcado como oculto, de modo que el bloqueador no ve contenido y el bloqueado no se entera. Las palabras ofensivas se enmascaran antes de guardar y difundir.
    casos:
      - {ac: "3, 14", titulo: "Mensajes en tiempo real entre las partes", pre: "Emisor, transportista y receptor con el chat abierto.", pasos: "El emisor envía un mensaje; luego lo hace el receptor, también con el envío recién asignado.", esperado: "El mensaje llega por WebSocket al resto y al propio emisor; el chat no se mezcla con el canal de tracking.", test: services/movo-svc-shipments/test/chat.integration.test.ts}
      - {ac: "2", titulo: "Validación del texto", pre: "Chat abierto.", pasos: "Enviar mensajes vacíos, solo espacios o de más de 1000 caracteres.", esperado: "Se rechazan; el reenvío con el mismo clientMessageId no duplica (una fila, una difusión).", test: services/movo-svc-shipments/test/chat.integration.test.ts}
      - {ac: "16", titulo: "Lenguaje ofensivo", pre: "Mensaje con una palabra ofensiva.", pasos: "Enviar el mensaje y reenviarlo.", esperado: "La palabra se enmascara con asteriscos del mismo largo antes de guardar y difundir; un mensaje limpio no se marca; el reenvío devuelve el mismo texto ya tapado.", test: [services/movo-svc-shipments/test/chat.integration.test.ts, services/movo-svc-shipments/test/chat-moderation.test.ts]}
      - {ac: "7, 15", titulo: "Acceso y conexión", pre: "Tercero ajeno al envío, sin token o con envío inexistente.", pasos: "Leer, escribir y conectar al WebSocket.", esperado: "403 al leer y escribir; 4003 al conectar; 4001 sin token; 4004 si no existe.", test: services/movo-svc-shipments/test/chat.integration.test.ts}
      - {ac: "10", titulo: "Bloqueo entre las partes", pre: "Un usuario con bloqueo hacia el autor.", pasos: "El autor escribe.", esperado: "Escribir no se impide; a quien tiene el bloqueo le llega el contenido vacío (hidden) y los demás lo ven normal.", test: services/movo-svc-shipments/test/chat.integration.test.ts}
      - {ac: "4", titulo: "Historial paginado", pre: "Chat con varios mensajes.", pasos: "GET /shipments/:id/chat/messages con cursor, y con un cursor inválido.", esperado: "Pagina del más reciente al más antiguo sin repetir ni saltear; cursor inválido: 400.", test: services/movo-svc-shipments/test/chat.integration.test.ts}
      - {ac: "8, 9, 6", titulo: "Cierre y solo lectura", pre: "Envío cancelado, entregado hace más de 24 h, con receptor transferido, y un admin.", pasos: "Leer y escribir en cada caso.", esperado: "Cancelado: 409 CHAT_CLOSED y el socket se corta con 4009. Entregado: solo lectura y archivado pasadas 24 h. Receptor original: lee y recibe 403 CHAT_READ_ONLY al escribir. Admin: lee siempre y nunca escribe.", test: [services/movo-svc-shipments/test/chat.integration.test.ts, services/movo-svc-shipments/test/chat-window.test.ts]}
      - {ac: "14", titulo: "Notificación de mensajes nuevos", pre: "Partes sin el chat abierto.", pasos: "Enviar un mensaje y luego una ráfaga.", esperado: "El primer mensaje avisa enseguida con nombre, rol y texto; la ráfaga se resume en un único aviso con la cantidad y el último mensaje, en orden y sin dejar mensajes sin avisar.", test: services/movo-svc-shipments/test/chat.integration.test.ts}

  - id: MOVO-275
    nombre: Transferencia de la recepción a otra persona
    secuencias:
      - {id: seq-transferir-receptor, titulo: "Solicitud, aceptación y rechazo de la transferencia de receptor (MOVO-275, DD-038)."}
    nota: |
      **Decisión de diseño (DD-038).** El cambio de receptor es atómico y se resuelve con compare-and-swap, de modo que si la entrega empieza justo antes del cambio, el receptor no se modifica. Un envío admite una sola transferencia completada y una solicitud activa a la vez. El receptor original conserva acceso de solo lectura, con el seguimiento en vivo y un resumen de la transferencia.
    casos:
      - {ac: "1, 4", titulo: "Pedir la transferencia", pre: "Receptor actual con envío publicado, asignado o en camino.", pasos: "POST /shipments/:id/receiver-transfer con la persona elegida.", esperado: "201; la invitada y el emisor reciben su push (el emisor, solo informativa).", test: services/movo-svc-shipments/test/receiver-transfers.integration.test.ts}
