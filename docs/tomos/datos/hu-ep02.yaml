# EP-02 · Publicación y Descubrimiento: historias, secuencias y casos de prueba.
historias:
  - id: MOVO-8
    nombre: Creación de un envío
    secuencias:
      - {id: seq-crear-envio, titulo: "Cotización congelada y creación del envío, a la espera del receptor (MOVO-8, MOVO-82, MOVO-83)."}
    nota: |
      **Decisión de diseño.** El precio sugerido se cotiza antes de confirmar y queda congelado 15 minutos en Redis bajo un `quoteId` de un solo uso, atado al usuario y a los datos que afectan el precio (ADR-028). Si el servicio de precios falla, el envío se crea igual con "precio a estimar". El paquete tiene límites duros de 30 kg, 150 cm por lado y 300 cm de suma de lados (MOVO-276). El envío nace en `awaiting_receiver_confirmation` y no llega al mercado hasta que el receptor lo acepta.
    casos:
      - {ac: "1, 2, 11, 13", titulo: "Creación válida", pre: "Emisor autenticado y receptor con KYC aprobado.", pasos: "POST /shipments con paquete, direcciones, franja de retiro y receptor.", esperado: "201; el envío queda en awaiting_receiver_confirmation con su evento inicial y el receptor recibe la notificación. Si el servicio de notificaciones falla, el envío se crea igual.", test: services/movo-svc-shipments/test/shipments-create.integration.test.ts}
      - {ac: "3", titulo: "Validación del receptor", pre: "Emisor autenticado.", pasos: "Crear designándose a sí mismo, a un usuario inexistente y a uno sin KYC aprobado.", esperado: "422 para el autoenvío y para el receptor sin KYC; 404 para el inexistente. No se crea ningún envío.", test: services/movo-svc-shipments/test/shipments-create.integration.test.ts}
      - {ac: "4", titulo: "Franja de retiro en el pasado", pre: "Emisor autenticado.", pasos: "Crear con una franja de retiro anterior al momento actual.", esperado: "422 y ningún envío creado.", test: services/movo-svc-shipments/test/shipments-create.integration.test.ts}
      - {ac: "2", titulo: "Límites duros del paquete", pre: "Emisor autenticado.", pasos: "Crear o cotizar un paquete de más de 30 kg, con un lado de más de 150 cm o con suma de lados mayor a 300 cm.", esperado: "422 con el detalle del límite excedido; al cotizar no se llama al servicio de precios.", test: [services/movo-svc-shipments/test/shipments-create.integration.test.ts, services/movo-svc-shipments/test/package-limits.test.ts, services/movo-svc-shipments/test/shipments-quote.integration.test.ts]}
      - {ac: "-", titulo: "La identidad del emisor sale del header", pre: "Pedido con un senderId falsificado en el body, y otro sin x-user-id.", pasos: "POST /shipments.", esperado: "El senderId del body se ignora y se usa el del header; sin header, 401.", test: services/movo-svc-shipments/test/shipments-create.integration.test.ts}
      - {ac: "6, 7, 8, 9", titulo: "Precio sugerido persistido y degradación", pre: "Servicio de precios disponible, y luego caído.", pasos: "Crear un envío en cada situación.", esperado: "Con precios disponibles se persisten suggestedPriceArs, calculationMethod y highDemand. Con precios caídos el envío se crea con precio nulo (\"precio a estimar\").", test: [services/movo-svc-shipments/test/shipments-create.integration.test.ts, services/movo-svc-shipments/test/shipment-quote.test.ts]}
      - {ac: "6, 7", titulo: "Cotización congelada de un solo uso", pre: "Cotización vigente de un usuario.", pasos: "Crear el envío con el quoteId, aunque el precio haya cambiado entre medio; reusar el quoteId; usarlo desde otro usuario o con datos distintos.", esperado: "Se respeta el precio cotizado sin volver a cotizar. Reuso o vencimiento: 409 QUOTE_EXPIRED. Otro usuario: no puede usarlo y no lo consume. Datos distintos: 409 QUOTE_MISMATCH. Descripción, dirección escrita y franja no invalidan la cotización.", test: [services/movo-svc-shipments/test/shipments-quote.integration.test.ts, services/movo-svc-shipments/test/quote-store.test.ts]}
      - {ac: "5", titulo: "Fotos de evidencia del paquete", pre: "Envío en creación.", pasos: "Pedir la URL prefirmada, subir el archivo y confirmar la foto; probar tipo de archivo, tamaño y permisos inválidos.", esperado: "Se registra la foto (idempotente al confirmar dos veces). Tipo no permitido, tamaño mayor a 2 MB, clave ajena o tercero sin permiso: rechazo. Máximo de fotos por etapa: 422.", test: services/movo-svc-shipments/test/photos.integration.test.ts}

  - id: MOVO-16
    nombre: Confirmación o rechazo del envío por el receptor
    secuencias:
      - {id: seq-receptor, titulo: "Decisión del receptor, plazo de respuesta y nueva designación (MOVO-16, MOVO-130, MOVO-253)."}
    nota: |
      **Decisión de diseño.** El receptor solo puede aceptar o rechazar, nunca editar. El plazo de respuesta (MOVO-130) lo hace cumplir un barrido periódico con lock en Redis, de modo que corra una sola réplica. Si el receptor rechaza, el emisor tiene 48 h para designar a otro (ADR-027).
    casos:
      - {ac: "4, 7", titulo: "El receptor acepta el envío", pre: "Envío en awaiting_receiver_confirmation con fotos de creación.", pasos: "POST /shipments/:id/accept con y sin campos extra en el body.", esperado: "El envío pasa a published; los campos extra se ignoran. Sin fotos de creación o ya aceptado: 409.", test: services/movo-svc-shipments/test/shipments-accept-reject.integration.test.ts}
      - {ac: "4, 5", titulo: "El receptor rechaza el envío", pre: "Envío en awaiting_receiver_confirmation.", pasos: "POST /shipments/:id/reject con y sin motivo.", esperado: "El envío pasa a rejected_by_receiver, con el motivo si se informó. Si ya fue cancelado o rechazado: 409.", test: services/movo-svc-shipments/test/shipments-accept-reject.integration.test.ts}
      - {ac: "7", titulo: "Solo el receptor decide", pre: "Envío esperando confirmación.", pasos: "Aceptar y rechazar como emisor, como admin y como tercero; con envío inexistente; sin identidad.", esperado: "403 para emisor, admin y tercero; 404 inexistente; 401 sin x-user-id.", test: services/movo-svc-shipments/test/shipments-accept-reject.integration.test.ts}
      - {ac: "6", titulo: "Plazo de respuesta vencido", pre: "Envío cuyo plazo de confirmación del receptor ya venció.", pasos: "Aceptar o rechazar; luego correr el barrido de vencimiento.", esperado: "409 al responder tarde, aunque el barrido no haya corrido. El barrido cancela el envío y avisa al emisor; no corre si otra réplica tiene el lock.", test: [services/movo-svc-shipments/test/shipments-accept-reject.integration.test.ts, services/movo-svc-shipments/test/receiver-confirmation-sweep.test.ts, services/movo-svc-shipments/test/shipment-expiration.integration.test.ts]}
      - {ac: "5", titulo: "El emisor elige otro receptor", pre: "Envío rechazado, dentro de las 48 h.", pasos: "POST /shipments/:id/receiver con un receptor nuevo; probar uno que ya rechazó, uno sin KYC, uno bloqueado, uno mismo, plazo vencido y dos elecciones concurrentes.", esperado: "El envío vuelve a esperar confirmación y el receptor nuevo recibe la notificación; las elecciones inválidas responden 409 o 422 y, ante concurrencia, solo una gana.", test: services/movo-svc-shipments/test/shipments-redesignate-receiver.integration.test.ts}
      - {ac: "5, 6", titulo: "Match automático con viajes al publicarse", pre: "Transportista con un viaje declarado compatible.", pasos: "Aceptar el envío.", esperado: "Se envía exactamente una push trip_match al transportista del viaje compatible; sin viaje compatible, o con viaje no viable según ruteo, no se envía ninguna.", test: services/movo-svc-shipments/test/shipments-accept-reject.integration.test.ts}

  - id: MOVO-18
    nombre: Declaración y gestión de viajes
    secuencias:
      - {id: seq-viaje-feed, titulo: "Declaración del viaje y consulta de paquetes compatibles (MOVO-18, MOVO-19)."}
    nota: |
      **Alcance final.** Además de declarar, editar y cancelar, el viaje tiene ciclo de vida propio (declarado, activo, completado, cancelado, vencido), inicio explícito (MOVO-221), recurrencia semanal (MOVO-265) y vencimiento automático. Solo puede haber un viaje activo por transportista, garantizado por un índice único parcial en la base de datos.
    casos:
      - {ac: "1", titulo: "Declarar un viaje", pre: "Transportista verificado.", pasos: "POST /trips con origen, destino, salida y vehículo; luego con un body inválido.", esperado: "201 con el viaje en declared; body inválido: 400 VALIDATION_FAILED.", test: services/movo-svc-shipments/test/trips.routes.test.ts}
      - {ac: "3", titulo: "Editar y eliminar un viaje declarado", pre: "Viaje declared del transportista.", pasos: "PATCH /trips/:id y DELETE /trips/:id.", esperado: "200 con el viaje actualizado y 204 al eliminar. El estado nunca se modifica por PATCH.", test: services/movo-svc-shipments/test/trips.routes.test.ts}
      - {ac: "3, 4", titulo: "Cancelar un viaje", pre: "Viaje declared, con y sin paquetes aceptados.", pasos: "POST /trips/:id/cancel.", esperado: "Sin paquetes aceptados pasa a cancelled y desasocia las ofertas pendientes. Con un paquete aceptado se rechaza (TripHasAcceptedPackagesError). Cancelar dos veces o un viaje activo: 409 TRIP_NOT_DECLARED.", test: [services/movo-svc-shipments/test/trip-cancel.integration.test.ts, services/movo-svc-shipments/test/trips.routes.test.ts]}
      - {ac: "5", titulo: "Iniciar el viaje", pre: "Viaje declared con al menos un paquete asignado.", pasos: "POST /trips/:id/start; repetir; iniciar otro viaje del mismo transportista; iniciar dos viajes en paralelo.", esperado: "Pasa a active y las ofertas pendientes se desasocian. Sin paquetes: error; segundo inicio: 409. Con otro viaje activo: 409 TRIP_ALREADY_HAS_ACTIVE_TRIP; con concurrencia exactamente uno gana, y el índice único lo garantiza aun escribiendo directo en la base.", test: [services/movo-svc-shipments/test/trip-lifecycle.integration.test.ts, services/movo-svc-shipments/test/trip-start.integration.test.ts, services/movo-svc-shipments/test/trips.routes.test.ts]}
      - {ac: "2", titulo: "Paquetes compatibles con la ruta", pre: "Viaje declarado y envíos publicados.", pasos: "GET /trips/:id/matches.", esperado: "Devuelve los paquetes dentro del corredor de la ruta, con hasMyOffer y fechas formateadas. Si falla el servicio de ruteo responde 502 (política No-Fallback).", test: [services/movo-svc-shipments/test/trips.routes.test.ts, services/movo-svc-shipments/test/trip-compatibility.test.ts]}
      - {ac: "-", titulo: "Vencimiento de viajes", pre: "Viaje declared con salida vencida.", pasos: "Correr el barrido de vencimiento.", esperado: "Un viaje vencido sin paquetes se cancela; uno con paquete aceptado queda intacto; uno activo nunca se toca. El barrido respeta el tamaño de lote.", test: [services/movo-svc-shipments/test/trip-expiry.integration.test.ts, services/movo-svc-shipments/test/trip-expiry-sweep.test.ts]}
      - {ac: "-", titulo: "Recurrencia semanal", pre: "Viaje con recurrencia por días de la semana.", pasos: "Correr el generador de la próxima ocurrencia en distintas situaciones.", esperado: "Declara la siguiente a la misma hora, es idempotente, respeta recurrenceUntil, pausa si la cuenta está suspendida o con deuda vencida y corta la serie si faltan requisitos o la cuenta se dio de baja.", test: [services/movo-svc-shipments/test/trip-recurrence.integration.test.ts, services/movo-svc-shipments/test/trip-recurrence.test.ts]}

  - id: MOVO-19
    nombre: Feed de paquetes disponibles
    nota: |
      **Decisión de diseño.** El filtro es siempre `status = published` y por cercanía geográfica al origen (y opcionalmente al destino). El feed no expone datos personales del emisor ni del receptor, solo direcciones aproximadas, ventana horaria y distancias, para no revelar la puerta antes del acuerdo.
    casos:
      - {ac: "20-26", titulo: "Acceso restringido al transportista verificado", pre: "Usuarios sin rol carrier, con rol carrier no verificado y verificado.", pasos: "GET /shipments/available con cada uno.", esperado: "403 CARRIER_NOT_VERIFIED para los dos primeros; 200 para el verificado, sin exigir datos de licencia.", test: services/movo-svc-shipments/test/shipments-available.integration.test.ts}
      - {ac: "11-15", titulo: "Solo envíos publicados y ajenos", pre: "Envíos en varios estados y envíos propios del caller.", pasos: "GET /shipments/available.", esperado: "Solo aparecen los published; se excluyen los propios (como emisor o receptor).", test: services/movo-svc-shipments/test/shipments-available.integration.test.ts}
      - {ac: "4-10", titulo: "Contenido del item", pre: "Envío publicado.", pasos: "Inspeccionar la respuesta del feed.", esperado: "Incluye direcciones, ventana horaria y distancias, sin datos personales de emisor ni receptor. hasMyOffer es true solo con una oferta pendiente propia.", test: services/movo-svc-shipments/test/shipments-available.integration.test.ts}
      - {ac: "2, 3", titulo: "Filtro geográfico", pre: "Envíos a distintas distancias.", pasos: "Consultar sin radio, con radiusKm=500, sin coordenadas de origen, con destino incompleto y con destino completo.", esperado: "Radio por defecto 50 km; tope duro de 200 (400 si se excede); sin origen o con destino a medias: 400 VALIDATION_FAILED. Con destino, un envío a mitad de un trayecto largo aparece aunque esté lejos de ambos extremos por separado.", test: services/movo-svc-shipments/test/shipments-available.integration.test.ts}
      - {ac: "16, 17", titulo: "Paginación", pre: "Más envíos que el tamaño de página.", pasos: "Consultar con limit y page.", esperado: "Contrato {items, page, limit, total}.", test: services/movo-svc-shipments/test/shipments-available.integration.test.ts}

  - id: MOVO-29
    nombre: Cancelación de un envío por el emisor
    secuencias:
      - {id: seq-cancelar-envio, titulo: "Cancelación del envío según su estado, con y sin penalidad (MOVO-29, MOVO-307)."}
    nota: |
      **Decisión de diseño.** La penalidad depende del estado y de la cercanía del retiro: sin fondos confirmados no hay cargo, y desde `assigned` solo hay cargo si faltan menos de 12 horas para el retiro (MOVO-307). La cancelación es lógica e irreversible.
    casos:
      - {ac: "1, 4, 5", titulo: "Cancelar antes de la asignación", pre: "Envío en awaiting_receiver_confirmation.", pasos: "POST /shipments/:id/cancel con motivo.", esperado: "El envío pasa a cancelled y el motivo queda en el historial; no se consultan ofertas.", test: services/movo-svc-shipments/test/shipments-cancel.integration.test.ts}
      - {ac: "2", titulo: "Aviso a los transportistas con oferta", pre: "Envío published o assignment_pending con ofertas pendientes de dos transportistas y una retirada.", pasos: "Cancelar el envío.", esperado: "Se notifica solo a quienes tenían oferta pendiente. En assignment_pending se libera además el hold en curso. Un fallo de notificaciones no bloquea la cancelación.", test: services/movo-svc-shipments/test/shipments-cancel.integration.test.ts}
      - {ac: "3", titulo: "Cancelar un envío asignado", pre: "Envío assigned con fondos confirmados.", pasos: "Cancelar con 12 h o más de anticipación y con menos.", esperado: "Con 12 h o más: sin cargo. Con menos: se aplica la penalidad definida.", test: [services/movo-svc-shipments/test/shipments-cancel.integration.test.ts, services/movo-svc-shipments/test/shipments-cancel-penalty.integration.test.ts]}
      - {ac: "1, 4", titulo: "Permisos y estados inválidos", pre: "Envío del emisor.", pasos: "Cancelar como otro usuario, sin identidad, un envío inexistente y uno ya cancelado.", esperado: "403, 401, 404 y 409 SHIPMENT_INVALID_TRANSITION respectivamente.", test: services/movo-svc-shipments/test/shipments-cancel.integration.test.ts}

  - id: MOVO-27
    nombre: Historial de envíos
    casos:
      - {ac: "1, 2, 4", titulo: "Listado propio paginado", pre: "Usuario emisor y receptor en varios envíos.", pasos: "GET /shipments/mine con filtros y paginación.", esperado: "Lista solo los envíos donde participa como emisor o receptor, paginados; 401 sin identidad.", test: services/movo-svc-shipments/test/shipments-list-mine.integration.test.ts}
      - {ac: "-", titulo: "Conteo de ofertas vigentes", pre: "Envío publicado con ofertas.", pasos: "Listar como emisor y como receptor.", esperado: "El emisor ve el conteo de ofertas vigentes; el receptor no lo ve; es nulo si el envío no está publicado.", test: services/movo-svc-shipments/test/shipments-list-mine.integration.test.ts}
      - {ac: "3", titulo: "Línea de tiempo del envío", pre: "Envío con varios cambios de estado.", pasos: "GET /shipments/:id/events.", esperado: "Devuelve los eventos con su estado y marca de tiempo, solo a los participantes.", test: services/movo-svc-shipments/test/shipments-events.integration.test.ts}
      - {ac: "5", titulo: "Fotos de evidencia", pre: "Envío con fotos.", pasos: "Listar fotos como emisor, receptor, transportista asignado, admin y terceros.", esperado: "Participantes y admin ven las fotos con URL de lectura; un tercero o un transportista rechazado: 403.", test: services/movo-svc-shipments/test/photos.integration.test.ts}

  - id: MOVO-191
    nombre: Envíos activos en el inicio de la app
    casos:
      - {ac: "1, 2", titulo: "Tres secciones por rol", pre: "Usuario emisor de un envío y transportista de otro.", pasos: "Consultar los endpoints de enviando, transportando y recibiendo.", esperado: "Aparece solo en las secciones que corresponden y nunca ve envíos activos de otro usuario.", test: services/movo-svc-shipments/test/shipments-active.integration.test.ts}
      - {ac: "9", titulo: "Sin envíos activos", pre: "Usuario sin envíos activos en un rol.", pasos: "Consultar ese rol.", esperado: "200 con lista vacía (no 404); sin identidad, 401.", test: services/movo-svc-shipments/test/shipments-active.integration.test.ts}
      - {ac: "-", titulo: "Qué cuenta como activo", pre: "Envíos en published, assignment_pending, assigned_unfunded, assigned e in_transit.", pasos: "Listar activos.", esperado: "published y assignment_pending no cuentan; assigned_unfunded, assigned e in_transit sí.", test: services/movo-svc-shipments/test/shipments-active.integration.test.ts}
      - {ac: "3", titulo: "Badge de retiro y ventana vencida", pre: "Envíos con retiro hoy y con ventana vencida.", pasos: "Listar activos.", esperado: "isToday es verdadero solo si el retiro cae hoy en la zona horaria argentina; pickupWindowExpired solo en assigned, nunca en in_transit. Orden por fecha y hora de retiro ascendente.", test: services/movo-svc-shipments/test/shipments-active.integration.test.ts}
      - {ac: "4", titulo: "Contraparte según rol y estado", pre: "Envíos assigned e in_transit.", pasos: "Consultar cada sección.", esperado: "La contraparte es el transportista para emisor y receptor; para el transportista, el emisor antes del retiro y el receptor durante el tránsito. No se exponen ids crudos.", test: services/movo-svc-shipments/test/shipments-active.integration.test.ts}

  - id: MOVO-259
    nombre: Rediseño de "Mis viajes" para el transportista
    nota: |
      **Alcance final.** Sin criterios de aceptación en Linear: el alcance quedó definido por sus cuatro tickets hijos. Separa el estado `expired` de `cancelled` con cancelación lógica y listado por alcance (MOVO-260), muestra los paquetes aceptados en el detalle (MOVO-261), organiza la pantalla en pestañas "Próximos" e "Historial" (MOVO-262) y añade el detalle del viaje (MOVO-263).
    casos:
      - {ac: "-", titulo: "Listado por alcance", pre: "Viajes declared, active, completed, cancelled y expired de dos transportistas.", pasos: "GET /trips?scope=upcoming y scope=history.", esperado: "upcoming: solo declared y active, por salida ascendente. history: completed, cancelled y expired, por salida descendente. Nunca mezcla viajes de otro transportista.", test: [services/movo-svc-shipments/test/trip-cancel.integration.test.ts, services/movo-svc-shipments/test/trips.routes.test.ts]}
      - {ac: "-", titulo: "Detalle del viaje", pre: "Viaje con paquetes aceptados.", pasos: "GET /trips/:id.", esperado: "Devuelve el viaje con sus paquetes aceptados.", test: [services/movo-svc-shipments/test/trips.routes.test.ts, services/movo-svc-shipments/test/trip-repository.integration.test.ts]}
      - {ac: "-", titulo: "Cancelación lógica", pre: "Viaje declared.", pasos: "POST /trips/:id/cancel.", esperado: "El viaje no se borra: pasa a cancelled con cancelledAt; con stopRecurrence se corta la serie recurrente.", test: [services/movo-svc-shipments/test/trip-cancel.integration.test.ts, services/movo-svc-shipments/test/trips.routes.test.ts]}

  - id: MOVO-138
    nombre: Motor de precios dinámico
    nota: |
      **Evolución del método.** El criterio original (`demand_fuel_routes_v1`: distancia de Routes API, combustible y alta demanda) fue reemplazado por `package_tapered_v2` (ADR-041), que cobra por peso facturable (el mayor entre el real y el volumétrico) con tarifa decreciente por tramos. Se conservó el contrato `POST /quote`, el recargo por alta demanda y la degradación a Haversine si Routes API falla.
    casos:
      - {ac: "2, 3", titulo: "Fórmula y recargos", pre: "Parámetros de precio por configuración.", pasos: "Cotizar con y sin contexto de demanda, paquete frágil y distintos combustibles.", esperado: "El precio escala con el combustible, el recargo frágil se aplica al subtotal, el multiplicador de demanda sigue la tabla del spike y sin contexto es neutro. El resultado se redondea a múltiplos de 10.", test: services/movo-svc-pricing-logistics/tests/test_quote.py}
      - {ac: "4-8", titulo: "Combustible con caché y degradación", pre: "API de combustible disponible, lenta, caída o con valores absurdos.", pasos: "Pedir el precio del combustible.", esperado: "Se cachea y se sirve el último valor bueno ante falla; un valor absurdo se rechaza; sin Redis se usa el de configuración; consultas concurrentes llaman a la API una sola vez.", test: services/movo-svc-pricing-logistics/tests/test_fuel_price.py}
      - {ac: "2, 22-26", titulo: "Distancia por Routes API y degradación a Haversine", pre: "Proveedor de rutas disponible, caído, lento o sin API key.", pasos: "POST /quote en cada situación.", esperado: "Se usa la distancia de Routes API; si falla, es cero o excede el timeout corto, cotiza con Haversine por factor de ruta en lugar de propagar el error.", test: services/movo-svc-pricing-logistics/tests/test_quote.py}
      - {ac: "-", titulo: "Propiedades del precio (grilla de referencia)", pre: "Grilla de casos de referencia.", pasos: "Evaluar la grilla y propiedades de monotonía.", esperado: "Cada celda cae dentro de su banda; el precio nunca baja al aumentar distancia, peso o volumen; es cóncavo en la distancia; el peso volumétrico y el real se aplican según corresponda; los límites del paquete se rechazan fuera de rango.", test: services/movo-svc-pricing-logistics/tests/test_pricing_golden.py}
      - {ac: "15, 16", titulo: "Compatibilidad con el consumidor", pre: "Cliente de pricing en svc-shipments.", pasos: "Cotizar desde svc-shipments.", esperado: "El cliente interpreta el contrato (suggestedPriceArs, highDemand, calculationMethod) y degrada a precio nulo si pricing no responde.", test: [services/movo-svc-shipments/test/pricing-client.test.ts, services/movo-svc-shipments/test/shipment-quote.test.ts]}
