# EP-03 · Asignación y Negociación: historias, secuencias y casos de prueba.
historias:
  - id: MOVO-23
    nombre: Oferta del transportista
    secuencias:
      - {id: seq-crear-oferta, titulo: "Oferta del transportista, selección por el emisor y seguimiento (MOVO-23, MOVO-17, MOVO-109, MOVO-188, MOVO-189)."}
    nota: |
      **Decisión de diseño.** El transportista ingresa el monto **neto** que quiere cobrar. El sistema calcula el **bruto** (neto más comisión de Movo, tasa fija de configuración) y persiste el bruto en `price_offered`, que es lo que ve el emisor. La oferta puede proponer una fecha de retiro dentro de un máximo de 3 días posteriores a la ventana del envío (MOVO-177) y vence automáticamente; el vencimiento se resuelve en lectura, sin proceso en segundo plano.
    casos:
      - {ac: "1, 2, 4, 13", titulo: "Crear una oferta", pre: "Transportista habilitado y envío published.", pasos: "POST /shipments/:id/offers con el monto neto y la fecha de retiro propuesta.", esperado: "201 con la oferta en pending, el desglose neto, comisión y bruto, y notificación al emisor.", test: services/movo-svc-shipments/test/shipments-offers-create.integration.test.ts}
      - {ac: "11", titulo: "Solo transportistas habilitados", pre: "Usuario sin rol carrier y otro sin KYC de identidad aprobado.", pasos: "Ofertar con cada uno.", esperado: "403 CARRIER_NOT_VERIFIED.", test: services/movo-svc-shipments/test/shipments-offers-create.integration.test.ts}
      - {ac: "7", titulo: "Envío no ofertable", pre: "Envío no publicado, o con la ventana de retiro cerrada.", pasos: "Ofertar sobre cada uno.", esperado: "409 SHIPMENT_NOT_AVAILABLE_FOR_OFFER; el envío inexistente responde 404.", test: services/movo-svc-shipments/test/shipments-offers-create.integration.test.ts}
      - {ac: "-", titulo: "Emisor y receptor no ofertan", pre: "Envío published.", pasos: "El emisor y luego el receptor intentan ofertar.", esperado: "403 AUTH_FORBIDDEN en ambos casos.", test: services/movo-svc-shipments/test/shipments-offers-create.integration.test.ts}
      - {ac: "8, 9", titulo: "Una sola oferta pendiente por envío", pre: "El transportista ya tiene una oferta activa, o una previa rechazada.", pasos: "Ofertar de nuevo sobre el mismo envío.", esperado: "Con oferta activa: 409 OFFER_DUPLICATE_ACTIVE. Tras un rechazo: se crea una fila nueva. Distintos transportistas pueden ofertar a la vez.", test: [services/movo-svc-shipments/test/shipments-offers-create.integration.test.ts, services/movo-svc-shipments/test/offer-repository.integration.test.ts]}
      - {ac: "12", titulo: "Fecha y franja propuestas", pre: "Envío con ventana de retiro.", pasos: "Ofertar con fecha anterior al retiro, hasta 3 días después, más allá de 3 días, y con la franja incompleta o invertida.", esperado: "422 OFFER_DATE_OUT_OF_RANGE fuera del rango; 201 dentro; 422 VALIDATION_FAILED con un solo extremo de la franja; 422 OFFER_PICKUP_WINDOW_INVALID si termina antes de empezar. El vencimiento usa la franja propuesta.", test: services/movo-svc-shipments/test/shipments-offers-create.integration.test.ts}
      - {ac: "10", titulo: "Identidad tomada del header", pre: "Pedido con un carrierId en el body.", pasos: "POST /shipments/:id/offers.", esperado: "Se usa el carrierId del header inyectado por el gateway; el precio menor o igual a 0 responde 400 VALIDATION_FAILED.", test: services/movo-svc-shipments/test/shipments-offers-create.integration.test.ts}
      - {ac: "-", titulo: "Snapshot de reputación y degradación", pre: "Emisor y transportista con y sin calificaciones; servicio de usuarios caído.", pasos: "Crear la oferta en cada situación.", esperado: "Se guarda la reputación del transportista y del emisor al ofertar (nula si no hay calificaciones); si svc-users falla, la oferta se crea igual con el snapshot vacío.", test: [services/movo-svc-shipments/test/shipments-offers-create.integration.test.ts, services/movo-svc-shipments/test/offer-repository.integration.test.ts]}

  - id: MOVO-17
    nombre: Lista de ofertas y elección del transportista
    secuencias:
      - {id: seq-aceptar-oferta, titulo: "Aceptación de una oferta y asignación del transportista (MOVO-17, MOVO-210, MOVO-234)."}
    nota: |
      **Alcance final.** La historia no tiene criterios de aceptación en Linear; su alcance quedó en sus dos tickets hijos (lista de ofertas y aceptar o rechazar) y en los refinamientos posteriores: orden por precio o reputación, marca de oferta vista por el emisor (MOVO-189) y asignación atómica. Aceptar no cobra: deja el envío en `assignment_pending` (retiro cercano) o `assigned_unfunded` (retiro lejano) según la saga de asignación (ADR-037); el hold de fondos se resuelve en el tema Pagos.
    casos:
      - {ac: "-", titulo: "Lista de ofertas del envío", pre: "Envío con ofertas pendientes de varios transportistas.", pasos: "GET /shipments/:id/offers como emisor, como receptor, como tercero y como admin.", esperado: "El emisor y el admin ven la lista con el snapshot del transportista; el receptor y los terceros reciben 403; un envío inexistente responde 404.", test: services/movo-svc-shipments/test/shipments-offers-list.integration.test.ts}
      - {ac: "-", titulo: "Orden y alcance de la lista", pre: "Ofertas vigentes, vencidas y de un envío ya cancelado.", pasos: "Listar con sort por precio y por rating, y con includeResolved.", esperado: "Por defecto, precio ascendente; por rating, descendente con los nulos al final. Solo vigentes salvo includeResolved=true; una oferta pendiente de un envío cancelado no aparece como vigente.", test: services/movo-svc-shipments/test/shipments-offers-list.integration.test.ts}
      - {ac: "-", titulo: "Oferta vista por el emisor", pre: "Ofertas aún no leídas.", pasos: "El emisor lee la lista dos veces; luego llega una oferta nueva; luego la lee un admin.", esperado: "La primera lectura marca viewedAtBySender y la segunda no lo cambia; una oferta posterior queda sin marcar; el admin no marca nada.", test: services/movo-svc-shipments/test/shipments-offers-list.integration.test.ts}
      - {ac: "-", titulo: "Aceptar una oferta", pre: "Envío published con una oferta pendiente.", pasos: "POST /offers/:id/accept como emisor.", esperado: "El envío pasa a assignment_pending con carrierId y precio acordado, la oferta queda accepted, las demás se mantienen vivas hasta el pago, y la respuesta desglosa neto y comisión. Se avisa al transportista elegido.", test: [services/movo-svc-shipments/test/offers-accept-reject.integration.test.ts, services/movo-svc-shipments/test/funding.integration.test.ts]}
      - {ac: "-", titulo: "Aceptación concurrente o vencida", pre: "Oferta vencida, o dos aceptaciones simultáneas.", pasos: "Aceptar la oferta vencida; aceptar dos ofertas al mismo tiempo.", esperado: "Oferta vencida: 409. Con doble aceptación concurrente una gana y la otra recibe 409.", test: services/movo-svc-shipments/test/offers-accept-reject.integration.test.ts}
      - {ac: "-", titulo: "Solo el emisor decide", pre: "Oferta pendiente.", pasos: "Aceptar y rechazar como receptor, como admin, sin identidad, y una oferta inexistente.", esperado: "403 para receptor y admin, 401 sin identidad, 404 inexistente.", test: services/movo-svc-shipments/test/offers-accept-reject.integration.test.ts}
      - {ac: "-", titulo: "Rechazar una oferta", pre: "Oferta pendiente.", pasos: "POST /offers/:id/reject; luego el mismo transportista oferta de nuevo.", esperado: "El envío sigue published, se avisa al rechazado y puede volver a ofertar con una fila nueva. Rechazar una oferta ya resuelta: 409.", test: services/movo-svc-shipments/test/offers-accept-reject.integration.test.ts}
      - {ac: "-", titulo: "Viaje asociado a la asignación", pre: "Oferta sin viaje previo, o con un viaje compatible del transportista.", pasos: "Aceptar la oferta.", esperado: "Si no tenía viaje, se crea uno declared con origen, destino y salida del envío y se avisa al transportista; si hay un viaje compatible dentro del desvío máximo, se suma a él. Si el viaje queda fuera de rango, se crea uno nuevo.", test: services/movo-svc-shipments/test/offers-accept-reject.integration.test.ts}
      - {ac: "-", titulo: "Vigencia de los requisitos del transportista", pre: "Transportista que perdió la licencia o la cuenta de cobro después de ofertar.", pasos: "Aceptar su oferta.", esperado: "409 OFFER_CARRIER_NOT_ELIGIBLE sin revelar qué le falta; la oferta sigue pending para que el emisor elija otra.", test: services/movo-svc-shipments/test/offers-accept-reject.integration.test.ts}

  - id: MOVO-109
    nombre: Seguimiento de las ofertas del transportista
    nota: |
      **Alcance final.** Además del listado, cada oferta muestra su posición competitiva (`competitiveRank`), calculada en una consulta por lote: gana la mejor reputación como transportista y, a igual reputación, quien entregó más envíos y luego la oferta más antigua (MOVO-188). El transportista puede retirar o modificar una oferta pendiente.
    casos:
      - {ac: "1, 6", titulo: "Solo las ofertas propias", pre: "Ofertas de dos transportistas.", pasos: "GET /offers/mine con y sin un carrierId en el query.", esperado: "Lista únicamente las del transportista autenticado e ignora cualquier carrierId enviado; sin identidad, 401.", test: services/movo-svc-shipments/test/offers-mine.integration.test.ts}
      - {ac: "2, 3, 4", titulo: "Estado efectivo y contexto del envío", pre: "Ofertas pending vencidas, aceptadas, rechazadas y de un envío cancelado.", pasos: "Listar sin filtro y con ?status=expired.", esperado: "Una pending vencida sale como expired; cada ítem trae el contexto del envío, la fecha sin hora y el estado real del envío si fue aceptada. Sobre un envío cancelado queda shipment_cancelled.", test: services/movo-svc-shipments/test/offers-mine.integration.test.ts}
      - {ac: "-", titulo: "Posición competitiva", pre: "Tres transportistas ofertando el mismo envío.", pasos: "Cada uno consulta sus ofertas.", esperado: "Cada uno ve su propio rank; gana la mejor reputación, luego más entregas, luego la oferta más antigua. Las ofertas resueltas exponen rank nulo.", test: services/movo-svc-shipments/test/offers-mine.integration.test.ts}
      - {ac: "-", titulo: "Detalle de una oferta", pre: "Oferta propia y oferta ajena.", pasos: "GET /offers/:id.", esperado: "Mismo formato enriquecido que un ítem del listado; descuenta la deuda del transportista con su motivo y tope; 403 sobre una ajena y 404 sobre una inexistente.", test: services/movo-svc-shipments/test/offers-detail.integration.test.ts}
      - {ac: "-", titulo: "Modificar una oferta pendiente", pre: "Oferta pending del transportista.", pasos: "PATCH /offers/:id con precio, fecha o franja; probar oferta aceptada, vencida y ajena.", esperado: "Se actualiza el precio (neto a bruto) y se recalcula el vencimiento sin tocar createdAt; 409 OFFER_NOT_EDITABLE si está aceptada o vencida; 403 si no es el dueño; 422 ante fecha, franja o precio inválidos.", test: services/movo-svc-shipments/test/offers-update.integration.test.ts}
      - {ac: "-", titulo: "Retirar una oferta", pre: "Oferta pending del transportista.", pasos: "POST /offers/:id/withdraw; repetir sobre una aceptada; probar un tercero.", esperado: "La oferta pasa a withdrawn; sobre una ya aceptada, 409 OFFER_INVALID_TRANSITION; un tercero recibe 403. Un retiro concurrente con una edición siempre prevalece.", test: services/movo-svc-shipments/test/offers-withdraw.integration.test.ts}

  - id: MOVO-102
    nombre: Modelo y máquina de estados de la oferta
    nota: |
      **Alcance final.** Historia habilitadora, sin criterios de aceptación en Linear. Define la entidad `Offer` y su máquina de estados de seis valores (`pending`, `accepted`, `rejected`, `withdrawn`, `expired`, `superseded`), con el diagrama de transición en el documento de estados de este tomo. Una restricción única parcial impide dos ofertas `pending` del mismo transportista sobre un envío, y el estado `expired` se deriva en lectura a partir de `expires_at`.
    casos:
      - {ac: "-", titulo: "Transiciones válidas e inválidas", pre: "Cada estado de la máquina.", pasos: "Evaluar todas las transiciones posibles.", esperado: "El estado inicial es pending; solo las transiciones del diagrama son válidas; todo estado no terminal tiene al menos una salida; el error identifica origen y destino rechazados.", test: services/movo-svc-shipments/test/offer-state-machine.test.ts}
      - {ac: "-", titulo: "Persistencia y vencimiento en lectura", pre: "Ofertas pending con vencimiento futuro y pasado.", pasos: "Crear y leer ofertas.", esperado: "Se crea en pending con su snapshot; una pending con expiresAt vencido se lee como expired sin modificar la fila; el rango de fecha propuesta se valida contra el envío.", test: services/movo-svc-shipments/test/offer-repository.integration.test.ts}
