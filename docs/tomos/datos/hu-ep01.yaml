# EP-01 · Identidad y Confianza: historias, secuencias y casos de prueba.
historias:
  - id: MOVO-7
    nombre: Registro de usuario con verificación de identidad
    secuencias:
      - {id: seq-registro, titulo: "Registro con verificación de teléfono por OTP (MOVO-7, MOVO-70, MOVO-71)."}
      - {id: seq-kyc, titulo: "Verificación de identidad (KYC) delegada en Didit.me: sesión y webhook (MOVO-72)."}
    nota: |
      **Alcance final.** La historia padre se implementó en cuatro tickets: alta de usuario con validaciones (MOVO-70), verificación del teléfono por OTP (MOVO-71), integración con Didit.me (MOVO-72) y las pantallas del wizard de registro y del KYC embebido (MOVO-73). El registro además acepta los Términos y la Política de Privacidad en su versión vigente (MOVO-228). El criterio de la tarjeta de pago se retiró en el refinamiento porque lo cubren MOVO-65 (emisor) y MOVO-110 (transportista).
    casos:
      - {ac: "1", titulo: "Registro con datos válidos", pre: "El teléfono tiene un phoneVerificationToken vigente.", pasos: "Enviar POST /auth/register con nombre, apellido, DNI, email, contraseña, dirección y versiones legales vigentes.", esperado: "201 con tokens de sesión; el usuario queda con roles por defecto, phoneVerified=true y kycStatus not_started.", test: services/movo-svc-users/test/auth.register.integration.test.ts}
      - {ac: "1, 3", titulo: "Normalización del teléfono argentino", pre: "Ninguna.", pasos: "Registrar con variantes válidas del formato argentino (+54 9…, 0351…, 15…) y con un teléfono de formato inválido.", esperado: "Las variantes válidas se normalizan al mismo E.164; el formato inválido responde 400 VALIDATION_FAILED.", test: services/movo-svc-users/test/auth.register.integration.test.ts}
      - {ac: "2", titulo: "Email o teléfono ya registrados", pre: "Existe un usuario con ese email (o teléfono).", pasos: "Registrar un segundo usuario con el mismo email, o con el mismo teléfono escrito en otro formato.", esperado: "409 USER_EMAIL_ALREADY_EXISTS o USER_PHONE_ALREADY_EXISTS; el token OTP se libera para reintentar sin rehacer el código.", test: [services/movo-svc-users/test/auth.register.integration.test.ts, services/movo-svc-users/test/auth.register-token-release.test.ts]}
      - {ac: "3", titulo: "Verificación del teléfono por OTP", pre: "Teléfono válido sin cuenta.", pasos: "Pedir el código (send-otp), ingresarlo (verify-otp) y reintentar con código erróneo hasta agotar los 5 intentos.", esperado: "Código correcto: 200 con phoneVerificationToken. Código erróneo: 401 AUTH_OTP_INVALID; al sexto intento 422. Un reenvío dentro de los 60 s devuelve 429.", test: services/movo-svc-users/test/auth.otp.integration.test.ts}
      - {ac: "3", titulo: "El token de verificación es de un solo uso y atado al teléfono", pre: "Un phoneVerificationToken ya consumido en un registro.", pasos: "Reutilizarlo en un segundo registro, o usarlo con otro número.", esperado: "401 AUTH_OTP_INVALID en ambos casos, sin crear el usuario.", test: services/movo-svc-users/test/auth.register.integration.test.ts}
      - {ac: "4", titulo: "Creación de la sesión KYC", pre: "Usuario con teléfono verificado y KYC not_started.", pasos: "POST /kyc/session con el token de acceso.", esperado: "201 con sessionId y sessionToken; se crea el registro kyc_verification en pending y el caché del usuario pasa a pending. Con teléfono sin verificar o KYC ya aprobado: 409 KYC_SESSION_NOT_ALLOWED.", test: services/movo-svc-users/test/kyc.session.integration.test.ts}
      - {ac: "5, 6, 7", titulo: "Resolución del KYC por webhook", pre: "Sesión KYC en pending.", pasos: "Didit envía el webhook firmado con estado Approved, Declined o In Review.", esperado: "El usuario pasa a approved, rejected o manual_review; GET /kyc/status refleja el estado y, en revisión manual, el motivo. Un webhook duplicado no cambia nada.", test: [services/movo-svc-users/test/kyc.webhook.integration.test.ts, services/movo-svc-users/test/kyc.status.integration.test.ts]}
      - {ac: "5", titulo: "Webhook con firma inválida o fuera de ventana", pre: "Sesión KYC en pending.", pasos: "Enviar el webhook con firma errónea, sin cabeceras, o con timestamp a más de 300 s.", esperado: "401 KYC_WEBHOOK_INVALID_SIGNATURE y ningún cambio de estado (anti-replay).", test: [services/movo-svc-users/test/adapters/didit-signature.test.ts, services/movo-svc-users/test/kyc.webhook.integration.test.ts]}
      - {ac: "8", titulo: "No se almacenan documentos ni biometría", pre: "Sesión KYC resuelta.", pasos: "Inspeccionar lo persistido tras el webhook.", esperado: "Solo se guardan el estado, el identificador de sesión y la decisión redactada (advertencias); nunca imágenes ni datos biométricos.", test: services/movo-svc-users/test/kyc.webhook.integration.test.ts}

  - id: MOVO-63
    nombre: Inicio de sesión y gestión de la sesión
    secuencias:
      - {id: seq-sesion, titulo: "Inicio de sesión, uso del token de acceso y renovación con rotación (MOVO-63, MOVO-74, MOVO-75)."}
    nota: |
      **Decisión de diseño.** El access token dura 60 minutos y es un JWT; el refresh token es opaco, de un solo uso y vive 90 días en Redis (ADR-004 y ADR-013). Si un refresh token ya canjeado se vuelve a presentar, se interpreta como robo y se revocan todas las sesiones del usuario. El inicio de sesión usa el teléfono como identificador.
    casos:
      - {ac: "1, 2, 4", titulo: "Login con credenciales válidas", pre: "Usuario registrado y activo.", pasos: "POST /auth/login con teléfono y contraseña correctos.", esperado: "200 con accessToken, refreshToken, kycStatus y roles; el refresh token queda en Redis con TTL de 90 días.", test: services/movo-svc-users/test/auth.login.integration.test.ts}
      - {ac: "3", titulo: "Credenciales inválidas sin revelar si la cuenta existe", pre: "Un usuario existente y un teléfono sin cuenta.", pasos: "Login con contraseña incorrecta y con un teléfono inexistente.", esperado: "Ambos responden 401 AUTH_INVALID_CREDENTIALS con la misma forma; la verificación corre contra un hash ficticio para igualar el tiempo.", test: services/movo-svc-users/test/auth.login.integration.test.ts}
      - {ac: "5", titulo: "Usuario con KYC pendiente puede iniciar sesión", pre: "Usuario con kycStatus pending.", pasos: "Login.", esperado: "200; la app lo lleva al flujo de verificación pendiente en lugar del home.", test: services/movo-svc-users/test/auth.login.integration.test.ts}
      - {ac: "4", titulo: "Cuenta inhabilitada o suspendida", pre: "Cuenta con estado banned; otra con estado suspended.", pasos: "Login con cada una.", esperado: "banned: 403 ACCOUNT_DISABLED. suspended: el login es exitoso y el gateway bloquea después las operaciones.", test: services/movo-svc-users/test/auth.login.integration.test.ts}
      - {ac: "6", titulo: "Renovación del token con rotación", pre: "Refresh token vigente.", pasos: "POST /auth/refresh.", esperado: "200 con un par de tokens nuevo; roles y kycStatus se releen de la base; el refresh anterior queda inutilizable.", test: services/movo-svc-users/test/auth.refresh.integration.test.ts}
      - {ac: "7", titulo: "Reuso de un refresh token y token inválido", pre: "Refresh token ya canjeado, adulterado o inexistente.", pasos: "POST /auth/refresh con cada uno; además, dos refresh concurrentes con el mismo token.", esperado: "401 AUTH_REFRESH_INVALID; el reuso revoca todas las sesiones del usuario; con concurrencia solo uno rota (script Lua atómico).", test: services/movo-svc-users/test/auth.refresh.integration.test.ts}
      - {ac: "4", titulo: "Cierre de sesión", pre: "Usuario con dos sesiones abiertas.", pasos: "POST /auth/logout con el refresh de una; luego POST /auth/logout-all.", esperado: "204; logout revoca solo esa sesión y es idempotente; logout-all revoca todas.", test: services/movo-svc-users/test/auth.logout.integration.test.ts}
      - {ac: "2", titulo: "El gateway autentica y no confía en la identidad del cliente", pre: "Gateway en ejecución.", pasos: "Llamar a una ruta protegida sin token, con token vencido, malformado y con un x-user-id falsificado.", esperado: "401 AUTH_TOKEN_INVALID / AUTH_TOKEN_EXPIRED; el x-user-id del cliente se descarta y el gateway inyecta el verdadero.", test: [gateway/test/auth.test.ts, gateway/test/auth-plugin.test.ts]}

  - id: MOVO-64
    nombre: Recuperación de contraseña
    secuencias:
      - {id: seq-recuperar-clave, titulo: "Recuperación de contraseña por código (MOVO-64, MOVO-140)."}
    casos:
      - {ac: "1, 2, 3", titulo: "Pedido del código por teléfono o por email", pre: "Cuenta activa con teléfono (o email verificado).", pasos: "POST /auth/forgot-password con el teléfono o el email.", esperado: "200 {otpId, cooldownSeconds}; se envía un código de 6 dígitos por el canal usado.", test: services/movo-svc-users/test/auth.password-reset.integration.test.ts}
      - {ac: "5", titulo: "La respuesta no revela si la cuenta existe", pre: "Identificadores de una cuenta real, de una inexistente, de una baneada y de un email sin verificar.", pasos: "POST /auth/forgot-password con cada uno.", esperado: "Misma respuesta (estado y forma) en todos; solo la cuenta elegible recibe el código.", test: services/movo-svc-users/test/auth.password-reset.integration.test.ts}
      - {ac: "4", titulo: "Definir la contraseña nueva", pre: "Código verificado con un passwordResetToken vigente.", pasos: "POST /auth/reset-password con una contraseña que cumple la política, y otra que no.", esperado: "Cumple: 200 y el hash cambia. No cumple: 400 VALIDATION_FAILED.", test: services/movo-svc-users/test/auth.password-reset.integration.test.ts}
      - {ac: "6, 8", titulo: "Cierre de todas las sesiones y sin login automático", pre: "Usuario con sesiones abiertas en dos dispositivos.", pasos: "Completar el reseteo.", esperado: "Se revocan todas las sesiones y los access tokens previos; no se emiten tokens nuevos (el usuario vuelve al login).", test: services/movo-svc-users/test/auth.password-reset.integration.test.ts}
      - {ac: "9", titulo: "Token vencido o ya usado", pre: "passwordResetToken ya consumido o vencido.", pasos: "POST /auth/reset-password.", esperado: "401 AUTH_OTP_INVALID; la app explica el vencimiento y permite pedir un código desde cero.", test: services/movo-svc-users/test/auth.password-reset.integration.test.ts}

  - id: MOVO-14
    nombre: Perfil del usuario
    casos:
      - {ac: "1, 2, 3", titulo: "Perfil propio completo y perfil público acotado", pre: "Usuario autenticado y otro usuario.", pasos: "GET /users/me y GET /users/:id del otro usuario.", esperado: "El perfil propio incluye email y teléfono; el público omite email y teléfono y expone solo la proyección pública (nombre, foto, reputación, insignias, estado de la cuenta).", test: services/movo-svc-users/test/users.profile.integration.test.ts}
      - {ac: "4, 5", titulo: "Estado de verificación e insignias", pre: "Usuarios con KYC de identidad aprobado, con licencia aprobada, con ambos y con ninguno.", pasos: "GET /users/me de cada uno.", esperado: "Aparecen las insignias kyc_verified y license_verified según corresponda; sin KYC aprobado, isVerified es falso y badges está vacío.", test: services/movo-svc-users/test/users.profile.integration.test.ts}
      - {ac: "1", titulo: "Acceso sin identidad o con usuario inexistente", pre: "Sin header x-user-id, o con un id que no existe.", pasos: "GET /users/me.", esperado: "401 AUTH_TOKEN_INVALID o 404 USER_NOT_FOUND.", test: services/movo-svc-users/test/users.profile.integration.test.ts}

  - id: MOVO-31
    nombre: Edición de datos personales y de la cuenta
    casos:
      - {ac: "1", titulo: "Editar nombre y apellido", pre: "Usuario con KYC sin aprobar.", pasos: "PATCH /users/me con firstName y lastName.", esperado: "200 con el perfil actualizado. Con KYC de identidad aprobado y un nombre distinto: 409 PROFILE_NAME_LOCKED_BY_KYC.", test: services/movo-svc-users/test/users.profile-edit.integration.test.ts}
      - {ac: "5", titulo: "Campos no editables", pre: "Usuario autenticado.", pasos: "PATCH /users/me con email, phone, kycStatus, roles o photoUrl.", esperado: "400 VALIDATION_FAILED sin ningún efecto.", test: services/movo-svc-users/test/users.profile-edit.integration.test.ts}
      - {ac: "3, 4, 6", titulo: "Cambio de teléfono o email con verificación", pre: "Usuario con teléfono verificado.", pasos: "Pedir el código de cambio al valor nuevo, verificarlo; probar con un dato que ya es de otra cuenta.", esperado: "El cambio se aplica solo tras verificar el código enviado al valor nuevo; un teléfono o email ya registrado se rechaza con 409 PHONE_ALREADY_IN_USE o EMAIL_ALREADY_IN_USE (también si la colisión aparece recién al verificar); al cambiar el email se avisa al anterior.", test: services/movo-svc-users/test/users.profile-edit.integration.test.ts}
      - {ac: "2", titulo: "Foto de perfil", pre: "Usuario autenticado.", pasos: "Pedir URL de subida, subir y confirmar; reemplazar y eliminar la foto.", esperado: "Se persiste photo_url bajo profile-photos/{userId}/; el reemplazo borra el objeto anterior; DELETE es idempotente. Se rechazan tipos fuera de la lista y archivos mayores a 5 MB.", test: services/movo-svc-users/test/users.photo.integration.test.ts}
      - {ac: "8", titulo: "Cambio de contraseña", pre: "Usuario con dos sesiones.", pasos: "POST /users/me/password con la actual correcta, y otra vez con la actual incorrecta.", esperado: "Correcta: la contraseña cambia, las demás sesiones se cierran y se devuelve un par nuevo. Incorrecta: 401 sin efectos. A la sexta llamada en la ventana: 429.", test: services/movo-svc-users/test/users.account-settings.integration.test.ts}

  - id: MOVO-15
    nombre: Verificación de la licencia de conducir del transportista
    ac:
      - "El usuario puede subir la foto de su licencia de conducir desde la app (frente)."
      - "El sistema verifica que la imagen sea legible antes de procesarla."
      - "Al completar la verificación, el perfil muestra la insignia «Transportista verificado»."
      - "Un intento de verificación de licencia es independiente del KYC de identidad."
    nota: |
      **Refinamiento.** Los criterios de la tarjeta de pago de la versión original se removieron: estaban duplicados con MOVO-65 (método de pago del emisor) y, para el transportista, el cobro se hace por Split Payment sobre su cuenta de Mercado Pago (MOVO-110). La verificación se delega a Didit.me con un *workflow* propio para licencias (`DIDIT_WORKFLOW_ID_LICENSE`).
    casos:
      - {ac: "1", titulo: "Crear la sesión de licencia", pre: "Usuario con teléfono verificado.", pasos: "POST /kyc/license/session.", esperado: "201; se inserta una verificación de tipo license y kyc_status_license pasa a pending sin tocar kyc_status_identity.", test: services/movo-svc-users/test/kyc.license.integration.test.ts}
      - {ac: "4", titulo: "Independencia respecto del KYC de identidad", pre: "Identidad en pending o not_started.", pasos: "Abrir una sesión de licencia con identidad pendiente; abrirla con la licencia ya aprobada.", esperado: "Con identidad pending se permite; con la licencia approved: 409 KYC_SESSION_NOT_ALLOWED.", test: services/movo-svc-users/test/kyc.license.integration.test.ts}
      - {ac: "3", titulo: "Licencia aprobada habilita la insignia", pre: "Sesión de licencia en pending.", pasos: "Webhook Approved de tipo license con fecha de vencimiento.", esperado: "kyc_status_license pasa a approved, se crea el registro drivers_license (con o sin vencimiento) y el perfil muestra license_verified.", test: [services/movo-svc-users/test/kyc.webhook.integration.test.ts, services/movo-svc-users/test/users.profile.integration.test.ts]}
      - {ac: "4", titulo: "Estado de la licencia en revisión manual", pre: "Licencia en manual_review.", pasos: "GET /kyc/license/status.", esperado: "Devuelve el estado y el motivo del intento de licencia más reciente, no el de identidad.", test: services/movo-svc-users/test/kyc.license.integration.test.ts}

  - id: MOVO-39
    nombre: Baja de la cuenta
    casos:
      - {ac: "1, 3", titulo: "Baja con confirmación de contraseña", pre: "Usuario sin envíos activos ni disputas abiertas.", pasos: "DELETE /users/me con la contraseña correcta.", esperado: "La cuenta queda en estado deleted, anonimizada y sin sesiones; los registros de KYC y licencia se eliminan.", test: services/movo-svc-users/test/users.account-settings.integration.test.ts}
      - {ac: "2", titulo: "La baja se rechaza con operaciones en curso", pre: "Usuario con un envío activo o una disputa abierta.", pasos: "DELETE /users/me.", esperado: "409 ACCOUNT_HAS_ACTIVE_DISPUTES o ACCOUNT_HAS_ACTIVE_SHIPMENTS; la cuenta no se modifica. Una baja ya en curso responde 409 ACCOUNT_DELETION_IN_PROGRESS.", test: [services/movo-svc-users/test/users.account-settings.integration.test.ts, services/movo-svc-users/test/users.deletion-status.integration.test.ts]}
      - {ac: "5, 7", titulo: "Anonimización irreversible", pre: "Cuenta dada de baja.", pasos: "Intentar iniciar sesión con la cuenta eliminada y registrar una cuenta nueva con el mismo email y teléfono.", esperado: "El login responde 403; la cuenta no se recupera; el email y el teléfono quedan liberados; se borran la foto, los datos de KYC y licencia y la clave de dispositivo; la baja es idempotente (204).", test: services/movo-svc-users/test/users.account-settings.integration.test.ts}

  - id: MOVO-32
    nombre: Revisión de casos de KYC en revisión manual (procedimiento operativo)
    nota: |
      **Estado: pendiente.** La historia quedó en el *backlog*. Su resolución técnica ya existe (el webhook de Didit aplica la decisión manual, MOVO-72), pero falta el procedimiento operativo documentado y el acceso restringido a la consola. Los casos siguientes son los **previstos** a partir de los criterios de aceptación.
    casos:
      - {ac: "3", titulo: "La decisión manual se refleja en Movo", pre: "Usuario en manual_review.", pasos: "Un administrador aprueba o rechaza el caso en la consola de Didit.", esperado: "El webhook actualiza kyc_status_identity y el usuario queda habilitado o rechazado.", test: services/movo-svc-users/test/kyc.webhook.integration.test.ts}
      - {ac: "4, 5", titulo: "Notificación y reintento", pre: "Caso resuelto manualmente.", pasos: "Aprobar y, en otro caso, rechazar.", esperado: "Push de resultado al usuario; tras un rechazo la app explica el motivo y permite reintentar.", test: services/movo-svc-users/test/kyc.push.test.ts}
      - {ac: "1, 2", titulo: "Procedimiento operativo y acceso restringido", pre: "Administradores designados.", pasos: "Revisar el procedimiento documentado y la lista de accesos a la consola.", esperado: "Existe el procedimiento y solo acceden los administradores designados.", resultado: Pendiente}
