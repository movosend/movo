# EP-05 · Pagos y Economía: historias, secuencias y casos de prueba.
historias:
  - id: MOVO-12
    nombre: Reserva automática de fondos antes del retiro
    secuencias:
      - {id: seq-reservar-fondos, titulo: "Saga de asignación y reserva de fondos (hold) con ruta cercana y lejana (MOVO-12, MOVO-210, MOVO-211, MOVO-215)."}
    nota: |
      **Decisión de diseño (ADR-037).** Mercado Pago autoriza el pago sin capturarlo (*hold*): los fondos quedan reservados en la tarjeta del emisor pero no se cobran hasta que se confirma la entrega. La asignación sigue una saga de dos rutas según la cercanía del retiro: **cercana** (retiro dentro de N días, con N = 3 por defecto), el emisor paga en el acto y el envío espera en `assignment_pending` con un plazo de 30 minutos; **lejana**, el envío queda en `assigned_unfunded` y el pago se confirma cuando se abre la ventana de N días, con vencimiento 24 horas antes del retiro. En ambos casos, si el pago no se completa, el envío vuelve a `published` y ambas partes son notificadas. Un índice único parcial en la base impide dos holds vivos del mismo envío.
    casos:
      - {ac: "1", titulo: "Ruta cercana: pago al aceptar la oferta", pre: "Oferta aceptada con retiro dentro de la ventana cercana; transportista con Mercado Pago vinculado.", pasos: "GET /shipments/:id/funding y luego POST /shipments/:id/funding con el token de la tarjeta.", esperado: "El GET devuelve la clave pública, el monto y el plazo, solo al emisor; con hold autorizado el envío pasa de assignment_pending a assigned y se avisa a ambas partes.", test: [services/movo-svc-shipments/test/funding.integration.test.ts, services/movo-svc-payments/test/holds.integration.test.ts]}
      - {ac: "2", titulo: "Pago rechazado", pre: "Envío esperando pago.", pasos: "Pagar con una tarjeta rechazada, y luego reintentar.", esperado: "El estado no cambia; la respuesta trae el motivo y permite reintentar con otra clave de idempotencia. Si payments falla al crear el hold, 502 reintentable.", test: [services/movo-svc-shipments/test/funding.integration.test.ts, services/movo-svc-payments/test/holds.integration.test.ts]}
      - {ac: "2", titulo: "Plazo vencido", pre: "Envío en assignment_pending con el plazo de pago cumplido.", pasos: "Intentar pagar; correr el barrido de vencimiento.", esperado: "409 al pagar fuera de plazo. El barrido devuelve el envío a published sin transportista, deja la oferta sin aceptar, libera el hold y avisa a ambas partes; es idempotente y, si el hold ya estaba autorizado, reconcilia a assigned en lugar de revertir. Si no puede consultar el hold, no revierte a ciegas.", test: [services/movo-svc-shipments/test/funding.integration.test.ts, services/movo-svc-shipments/test/shipment-expiration.integration.test.ts]}
      - {ac: "3", titulo: "Ruta lejana", pre: "Oferta aceptada con retiro a más de N días.", pasos: "Aceptar la oferta.", esperado: "El envío queda en assigned_unfunded con transportista y precio, las demás ofertas siguen vivas y no se crea ningún hold.", test: [services/movo-svc-shipments/test/funding.integration.test.ts, services/movo-svc-shipments/test/funding-view.integration.test.ts]}
      - {ac: "4, 5, 8", titulo: "Ventana de pago y retiro bloqueado", pre: "Envío en assigned_unfunded.", pasos: "Correr el barrido al abrirse la ventana y al faltar menos de 24 h; intentar iniciar el retiro sin fondos.", esperado: "Se avisa al emisor una sola vez para confirmar el pago; sin pago antes de T-24 h el envío vuelve a published y se avisa a ambos. Un envío sin fondos no puede iniciar el retiro (el handshake exige assigned).", test: [services/movo-svc-shipments/test/funding.test.ts, services/movo-svc-shipments/test/handshake.integration.test.ts]}
      - {ac: "6", titulo: "Estado de la reserva visible", pre: "Envío con distintos estados de pago.", pasos: "Consultar el detalle como emisor, transportista, receptor y tercero.", esperado: "El emisor ve monto, tarjeta y motivo de un intento rechazado; el transportista solo si está pendiente o reservado; el receptor y un tercero no ven datos de pago. Si payments cae, el detalle responde igual sin el último intento.", test: [services/movo-svc-shipments/test/funding-view.integration.test.ts, services/movo-svc-shipments/test/funding-view.test.ts]}
      - {ac: "-", titulo: "Un solo hold por envío y pagos duplicados", pre: "Dos pedidos de pago simultáneos o un doble toque.", pasos: "POST /shipments/:id/funding repetido.", esperado: "Una sola asignación y un solo hold, con la misma clave de idempotencia; el reintento de un hold vigente devuelve el mismo hold sin nuevo cobro.", test: [services/movo-svc-shipments/test/funding.integration.test.ts, services/movo-svc-payments/test/holds.integration.test.ts]}
      - {ac: "9", titulo: "Liberar el hold", pre: "Hold autorizado.", pasos: "Liberarlo con el token del transportista, repetirlo, y probar con otro transportista o sin credenciales vigentes.", esperado: "La liberación es idempotente; la de otro transportista se rechaza sin tocar el hold; sin credenciales vigentes, 409 y el hold sigue vivo.", test: services/movo-svc-payments/test/holds.integration.test.ts}
      - {ac: "-", titulo: "Eventos del hold desde Mercado Pago", pre: "Webhook de Mercado Pago sobre un hold.", pasos: "Enviar el webhook con firma válida, inválida o ausente, y con distintos estados del pago.", esperado: "Firma inválida o ausente: 401 sin tocar nada. Hold vencido, cancelado o rechazado: se marca y se avisa a svc-shipments; un hold perdido con el paquete en camino alerta al equipo.", test: [services/movo-svc-payments/test/mp-webhook.integration.test.ts, services/movo-svc-payments/test/mp-webhook-signature.test.ts]}

  - id: MOVO-13
    nombre: Pago automático al transportista (split payment)
    secuencias:
      - {id: seq-liquidacion, titulo: "Captura del hold, reparto de fondos, reintentos y webhook (MOVO-13, MOVO-212, MOVO-213, MOVO-214)."}
    nota: |
      **Decisión de diseño.** Al confirmarse la entrega, `svc-payments` captura el hold: la comisión de Movo queda como *application fee* y el neto se acredita directamente en la cuenta de Mercado Pago del transportista (split payment). Una captura fallida deja la liquidación en `failed` y el hold intacto, se reintenta con espera creciente (5, 30 y 120 minutos) y, si se agotan los reintentos, escala a revisión manual. Antes de reintentar se consulta el pago, para no capturar dos veces una operación que sí ocurrió pero cuya respuesta se perdió.
    casos:
      - {ac: "1, 2, 3", titulo: "Captura y liquidación", pre: "Hold autorizado y envío entregado.", pasos: "POST /internal/payments/holds/by-shipment/:id/capture.", esperado: "Se captura el hold, la liquidación se persiste con montos numéricos (comisión y neto) y el hold queda captured.", test: [services/movo-svc-payments/test/captures.integration.test.ts, services/movo-svc-payments/test/capture.service.test.ts]}
      - {ac: "1", titulo: "Captura única ante pedidos simultáneos", pre: "Dos pedidos de captura del mismo envío.", pasos: "Capturar dos veces, también en paralelo.", esperado: "Se cobra una sola vez; un hold rechazado no se captura y no crea liquidación.", test: services/movo-svc-payments/test/captures.integration.test.ts}
      - {ac: "4, 5", titulo: "Cierre del envío y avisos", pre: "Captura acreditada.", pasos: "Cerrar la liquidación en svc-shipments, invocarla dos veces, y con una push que falla.", esperado: "El envío pasa de delivered a completed; se avisa al transportista con el monto acreditado y al emisor del pago; una segunda invocación no captura ni avisa de nuevo y una push fallida no rompe el cierre.", test: [services/movo-svc-shipments/test/settlement.service.test.ts, services/movo-svc-shipments/test/settlement-events.integration.test.ts]}
      - {ac: "6", titulo: "Falla de la captura y reintentos", pre: "Mercado Pago rechaza o no responde.", pasos: "Capturar y correr el barrido de reintentos.", esperado: "El envío queda en delivered; la liquidación queda pendiente de reintento con motivo, intentos y próxima hora; reintenta con espera de 5, 30 y 120 minutos y, agotados, escala. No captura a ciegas si no puede consultar el pago.", test: [services/movo-svc-payments/test/capture-retry.integration.test.ts, services/movo-svc-payments/test/capture-retry-sweep.test.ts, services/movo-svc-payments/test/capture-failure.test.ts]}
      - {ac: "6", titulo: "Escalamiento inmediato", pre: "Cuenta del transportista rechazada u hold cancelado por Mercado Pago.", pasos: "Reintentar la captura.", esperado: "Escala de inmediato a revisión manual sin gastar intentos.", test: services/movo-svc-payments/test/capture-retry.integration.test.ts}
      - {ac: "7", titulo: "Detalle y consulta de la liquidación", pre: "Envío con y sin captura.", pasos: "GET de la liquidación del envío y del historial de transacciones.", esperado: "404 antes de capturar y 200 después; cada parte ve monto, comisión y neto.", test: [services/movo-svc-payments/test/captures.integration.test.ts, services/movo-svc-payments/test/transactions.integration.test.ts]}
      - {ac: "-", titulo: "Captura parcial y límites", pre: "Hold autorizado.", pasos: "Capturar un monto menor, mayor al hold o inferior a la comisión.", esperado: "Un monto menor captura parte del hold (cancellation_penalty); mayor: 422 CAPTURE_AMOUNT_EXCEEDS_HOLD; menor que la comisión: 422 CAPTURE_BELOW_APPLICATION_FEE; un envío ya liquidado como entrega responde 409 SETTLEMENT_CONFLICT.", test: services/movo-svc-payments/test/captures.integration.test.ts}

