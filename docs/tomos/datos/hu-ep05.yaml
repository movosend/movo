  - id: MOVO-37
    nombre: Pago de la comisión en efectivo
    nota: |
      **Estado.** Historia en *Por hacer*, fuera del alcance entregado: hoy el pago se hace solo con tarjeta mediante la reserva de fondos de MOVO-12. La documentación previa mencionaba el pago en efectivo; se corrigió porque no está implementado. Las tarjetas guardadas (MOVO-65) ya proveen la infraestructura que esta historia reutilizaría.
    casos:
      - {ac: "-", titulo: "Declarar pago en efectivo de la comisión", pre: "Historia no implementada.", pasos: "Previsto: el emisor declara que pagará en efectivo y el transportista registra la comisión.", esperado: "Casos de prueba por definir al implementarse la historia.", test: [], resultado: Pendiente}

  - id: MOVO-65
    nombre: Tarjetas guardadas
    secuencias:
      - {id: seq-cobros-vinculacion, titulo: "Vinculación de Mercado Pago del transportista y tarjetas guardadas del emisor (MOVO-110, MOVO-65)."}
    nota: |
      **Decisión de diseño.** Movo nunca recibe ni guarda número de tarjeta ni CVV: la app tokeniza con el SDK de Mercado Pago y el backend solo conserva el identificador de la tarjeta en el *customer* de Mercado Pago y metadatos de display (marca, últimos 4 y vencimiento). Para pagar con una tarjeta guardada se pide solo el CVV, que la app vuelve a tokenizar.
    casos:
      - {ac: "1, 3", titulo: "Guardar una tarjeta", pre: "Usuario autenticado.", pasos: "Guardar una tarjeta nueva y una segunda.", esperado: "Se crea el customer, la primera queda predeterminada y la segunda reutiliza el customer; sin alias queda en null; la respuesta no expone el número ni el CVV.", test: services/movo-svc-payments/test/cards.integration.test.ts}
      - {ac: "1", titulo: "Duplicados, tope y customer de Mercado Pago", pre: "Tarjeta repetida, tope alcanzado, customer ya existente o desaparecido.", pasos: "Guardar la tarjeta en cada situación.", esperado: "Una repetida devuelve 200 con la existente y borra la copia de MP; al pasar el tope no llama a MP; un customer del email ya existente se reutiliza salvo que sea de otra cuenta (409); uno inexistente se reemplaza.", test: services/movo-svc-payments/test/cards.integration.test.ts}
      - {ac: "4", titulo: "Fallas de Mercado Pago", pre: "Mercado Pago rechaza el alta o no responde.", pasos: "Guardar una tarjeta.", esperado: "El rechazo devuelve el motivo en el formato de error; sin respuesta, 502 sin persistir nada.", test: services/movo-svc-payments/test/cards.integration.test.ts}
      - {ac: "2", titulo: "Pagar con una tarjeta guardada", pre: "Tarjeta guardada del emisor.", pasos: "POST /shipments/:id/funding con savedCardId y el token del CVV; probar un id inválido o inexistente.", esperado: "El hold se crea con la tarjeta guardada; el cardToken sigue siendo obligatorio; un savedCardId que no es UUID se rechaza con 400 antes de llamar a payments; si payments responde 404 el envío no cambia.", test: services/movo-svc-shipments/test/funding.integration.test.ts}
      - {ac: "5", titulo: "Integridad de las tarjetas", pre: "Tarjetas vivas, eliminadas y de otros usuarios.", pasos: "Verificar los índices únicos y la propiedad del customer.", esperado: "Los índices únicos son parciales sobre las filas vivas y un customer pertenece a una sola cuenta.", test: services/movo-svc-payments/test/cards.integration.test.ts}

  - id: MOVO-110
    nombre: Vinculación de la cuenta de Mercado Pago del transportista
    nota: |
      **Decisión de diseño.** La vinculación usa el flujo OAuth *Marketplace* de Mercado Pago en un navegador embebido y vuelve sola a la app mediante un callback del servidor. Los tokens se guardan cifrados, se renuevan antes de los 180 días y, si la vinculación se invalida (revocada o con el refresh fallido), el estado pasa a `invalid` y el transportista no puede quedar confirmado en envíos que requieran cobrar.
    casos:
      - {ac: "1, 2, 5", titulo: "Estado de la vinculación", pre: "Transportista sin vincular, vinculado y desvinculado.", pasos: "GET /payments/mp-connect/status en cada estado.", esperado: "unlinked sin vinculación; linked con la cuenta y sin tokens expuestos; tras desvincular vuelve a no vinculada con la fecha de baja.", test: services/movo-svc-payments/test/mp-connect.integration.test.ts}
      - {ac: "3, 4", titulo: "Vinculación inválida", pre: "Vinculación revocada o con el token vencido.", pasos: "Consultar el estado.", esperado: "invalid con el motivo (revoked o expired), devolviendo igual la cuenta para ofrecer re-vincular.", test: services/movo-svc-payments/test/mp-connect.integration.test.ts}
      - {ac: "6", titulo: "Requisito para operar como transportista", pre: "Transportista con cuenta vigente, revocada, vencida o sin clave pública.", pasos: "Consultar la elegibilidad interna y el checkout.", esperado: "linked: true solo con una cuenta vigente y con clave pública (el mismo criterio que el hold); el checkout responde 409 explícito si el transportista no vinculó Mercado Pago.", test: [services/movo-svc-payments/test/mp-connect.integration.test.ts, services/movo-svc-payments/test/holds.integration.test.ts]}
      - {ac: "-", titulo: "Intercambio OAuth y cifrado de tokens", pre: "Código de autorización y tokens de Mercado Pago.", pasos: "Intercambiar el código, cifrar y descifrar los tokens, renovar.", esperado: "Los tokens se guardan cifrados con una clave propia y se renuevan sin intervención; el cliente de OAuth maneja los errores de Mercado Pago.", test: [services/movo-svc-payments/test/mercadopago-oauth-client.test.ts, services/movo-svc-payments/test/token-cipher.test.ts]}

  - id: MOVO-226
    nombre: Penalidad de cancelación y cuenta corriente
    secuencias:
      - {id: seq-penalidad-cancelacion, titulo: "Cancelación con penalidad, baja del transportista y cuenta corriente del usuario (MOVO-226, MOVO-307, MOVO-310)."}
    nota: |
      **Decisión de diseño (ADR-047).** Cancelar con un envío ya asignado no es gratuito si el retiro está cerca: con 12 horas o más de anticipación, o con la ventana de retiro ya cerrada, no hay cargo; con menos de 12 horas se cobra el 25 % del precio acordado mediante una **captura parcial** del hold. El emisor ve y confirma el monto exacto antes de cancelar; si cambió, la cancelación se rechaza (409) y no cobra nada. Lo que no se puede cobrar en el momento queda como **deuda** en la cuenta corriente del usuario, que se descuenta de su próxima operación y, si pasan más de 14 días sin saldar, bloquea nuevas operaciones. **Historia en curso:** sus tickets de términos y condiciones (MOVO-316) siguen abiertos.
    casos:
      - {ac: "1, 3", titulo: "Cargo calculado según la anticipación", pre: "Envío assigned con distintas horas al retiro.", pasos: "GET /shipments/:id/cancellation-quote.", esperado: "Con 12 h o más: sin cargo, indicando hasta cuándo; con menos de 12 h: 25 % del precio acordado; con la ventana ya cerrada: sin cargo, salvo que el transportista haya llegado al punto de retiro (ADR-052), caso en que se cobra el 25 %. Antes de assigned no hay penalidad.", test: services/movo-svc-shipments/test/shipments-cancel-penalty.integration.test.ts}
      - {ac: "3", titulo: "Cancelación con penalidad", pre: "Envío assigned con menos de 12 h al retiro y hold autorizado.", pasos: "POST /shipments/:id/cancel con el monto mostrado.", esperado: "El envío se cancela, se captura parte del hold, se registra la deuda y el cobro y se avisa a ambas partes. Si la penalidad no cubre la comisión más el fee de MP, se libera el hold y queda como deuda.", test: [services/movo-svc-shipments/test/shipments-cancel-penalty.integration.test.ts, services/movo-svc-payments/test/captures.integration.test.ts]}
      - {ac: "3", titulo: "Monto distinto o retiro concurrente", pre: "Monto desactualizado o retiro ya ocurrido.", pasos: "Cancelar con un monto que no coincide, o con el retiro ya hecho.", esperado: "409 CANCELLATION_PENALTY_MISMATCH con el monto vigente sin cancelar; si el retiro gana, 409 sin cobrar nada. Un monto viejo con la ventana cerrada también da 409.", test: services/movo-svc-shipments/test/shipments-cancel-penalty.integration.test.ts}
      - {ac: "-", titulo: "Cancelación sin cargo", pre: "Envío assigned con 12 h o más, o hold vencido o inexistente.", pasos: "Cancelar.", esperado: "Sin cargo, libera el hold entero y no toca la cuenta corriente; con hold vencido o inexistente, la penalidad queda como deuda. Si la captura falla, el envío queda cancelado y el barrido la reintenta sin duplicar.", test: services/movo-svc-shipments/test/shipments-cancel-penalty.integration.test.ts}
      - {ac: "-", titulo: "Baja del transportista", pre: "Transportista asignado con y sin hold.", pasos: "POST /shipments/:id/carrier-withdrawal con distintas anticipaciones.", esperado: "Republica el envío, desasigna, libera el hold entero y registra la penalidad como deuda del transportista (sin cargo con 12 h o más); solo el transportista asignado y antes del retiro; si Payments falla, conserva la asignación y se puede reintentar; con el retiro concurrente gana uno solo.", test: services/movo-svc-shipments/test/shipments-carrier-withdrawal.integration.test.ts}
      - {ac: "-", titulo: "Cuenta corriente del usuario", pre: "Usuario con y sin movimientos.", pasos: "Registrar movimientos y consultar saldo y deuda.", esperado: "Suma con signo los movimientos no anulados, calcula la deuda más vieja, admite saldo a favor, no mezcla usuarios y es idempotente (201 y luego 200 con el mismo movimiento).", test: [services/movo-svc-payments/test/user-ledger.integration.test.ts, services/movo-svc-payments/test/user-ledger-origins.service.test.ts]}
      - {ac: "-", titulo: "Cobro de la deuda en la próxima operación", pre: "Transportista o emisor con deuda.", pasos: "Crear un hold con deuda pendiente.", esperado: "Al transportista se le descuenta toda la deuda del fee si es menor al tope, o el 30 % del precio con el resto pendiente; al emisor se le suma como recargo, visible en el checkout sin reservar nada. Si el hold se libera, rechaza o vence, la reserva se anula y la deuda vuelve a pendiente; dos holds en paralelo no descuentan dos veces.", test: [services/movo-svc-payments/test/debt-collection.integration.test.ts, services/movo-svc-shipments/test/debt-discount.test.ts]}
      - {ac: "-", titulo: "Pagar mi saldo", pre: "Usuario con deuda y tarjeta guardada.", pasos: "GET /payments/balance/pay-data y POST /payments/balance/pay.", esperado: "422 si no hay deuda o el monto la supera; 400 con monto inválido; un pago aprobado cobra con el token de la cuenta cobradora de Movo y asienta un único voluntary_payment; la respuesta no expone el customer ni la tarjeta.", test: services/movo-svc-payments/test/balance-payment.integration.test.ts}
      - {ac: "-", titulo: "Bloqueo por deuda vencida", pre: "Deuda sin saldar por más de 14 días.", pasos: "Evaluar si la deuda está vencida.", esperado: "Más de 14 días: vencida (a los 14 justos todavía no); una deuda reciente no bloquea; sin umbral de monto, una deuda de un peso bloquea igual; se respeta el umbral configurado.", test: services/movo-svc-shipments/test/user-debt.test.ts}
