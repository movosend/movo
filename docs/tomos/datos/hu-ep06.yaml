# EP-06 · Reputación y Comunidad: historias, secuencias y casos de prueba.
historias:
  - id: MOVO-22
    nombre: Calificación entre las partes de un envío
    secuencias:
      - {id: seq-calificar, titulo: "Calificación tras la entrega y reputación en el perfil (MOVO-22, MOVO-25)."}
    nota: |
      **Decisión de diseño.** Las tres partes del envío (emisor, transportista y receptor) pueden calificarse entre sí con 1 a 5 estrellas, categorías según el rol y un comentario opcional, durante 72 horas desde la entrega. Si el envío entra en disputa, esa ventana se extiende por el tiempo que duró. Un envío `completed` (entregado y pagado) se califica igual que uno `delivered` (MOVO-208).
    casos:
      - {ac: "1, 2", titulo: "Calificar a la contraparte", pre: "Envío entregado y participante habilitado.", pasos: "POST /shipments/:id/ratings con score, categorías y comentario.", esperado: "201; se persiste la calificación con el rol del calificado y se avisa por push. Se aceptan las categorías del emisor, transportista y receptor (puntualidad, comunicación, etc.).", test: [services/movo-svc-shipments/test/ratings.integration.test.ts, services/movo-svc-shipments/test/ratings-service.test.ts]}
      - {ac: "6", titulo: "Solo participantes de un envío entregado", pre: "Envío no entregado, calificador ajeno, calificado ajeno o autocalificación.", pasos: "Calificar en cada caso.", esperado: "409 SHIPMENT_NOT_DELIVERED si no está entregado; 403 si el calificador o el calificado no participó, o si se califica a sí mismo.", test: [services/movo-svc-shipments/test/ratings.integration.test.ts, services/movo-svc-shipments/test/ratings-service.test.ts]}
      - {ac: "2", titulo: "Rango del puntaje", pre: "Participante habilitado.", pasos: "Calificar con un puntaje fuera de 1 a 5.", esperado: "400 VALIDATION_FAILED.", test: services/movo-svc-shipments/test/ratings.integration.test.ts}
      - {ac: "3", titulo: "Ventana de 72 horas", pre: "Envío entregado hace más y menos de 72 h.", pasos: "Calificar en cada caso.", esperado: "Dentro de la ventana se acepta (inclusive hasta el instante del límite); fuera, 409 SHIPMENT_RATING_WINDOW_EXPIRED. Un período completo en disputa extiende el límite por su duración.", test: [services/movo-svc-shipments/test/ratings.integration.test.ts, services/movo-svc-shipments/test/rating-window.test.ts]}
      - {ac: "7", titulo: "Disputa activa", pre: "Envío en disputa.", pasos: "Calificar.", esperado: "409 SHIPMENT_RATING_DISPUTE_ACTIVE hasta la resolución.", test: [services/movo-svc-shipments/test/ratings.integration.test.ts, services/movo-svc-shipments/test/ratings-service.test.ts]}
      - {ac: "4", titulo: "Una calificación por par y edición", pre: "Calificación ya enviada.", pasos: "Calificar de nuevo; editar con PATCH /shipments/:id/ratings/:rateeId.", esperado: "409 SHIPMENT_RATING_ALREADY_EXISTS; la edición actualiza la fila existente en lugar de crear otra.", test: services/movo-svc-shipments/test/ratings.integration.test.ts}
      - {ac: "5", titulo: "Consulta de las calificaciones de un envío", pre: "Envío con calificaciones.", pasos: "GET /shipments/:id/ratings como participante y como ajeno.", esperado: "Los participantes ven las calificaciones; un ajeno recibe 403.", test: services/movo-svc-shipments/test/ratings.integration.test.ts}
      - {ac: "1", titulo: "Calificaciones pendientes", pre: "Envíos entregados con y sin calificar.", pasos: "GET /shipments/pending-ratings.", esperado: "Lista a quién falta calificar en cada envío entregado o completado; ya calificado no aparece; sin envíos, 200 con lista vacía; sin identidad, 401.", test: services/movo-svc-shipments/test/shipments-pending-ratings.integration.test.ts}

  - id: MOVO-25
    nombre: Score de reputación ponderado en el perfil
    nota: |
      **Decisión de diseño.** El score no es un promedio simple: usa **contracción bayesiana** hacia la media global de la plataforma (una única calificación de 5 estrellas nunca da 5,0) y un **decaimiento temporal** con semivida configurable, de modo que una calificación vieja pesa menos que una reciente. Con menos de 3 calificaciones el perfil se marca como nuevo, pero el score igual se calcula. El perfil distingue lo recibido como emisor, transportista y receptor, y trae los comentarios recientes y las insignias de verificación.
    casos:
      - {ac: "1, 3", titulo: "Cálculo del score", pre: "Calificaciones de distintos valores y antigüedades.", pasos: "Calcular la reputación con 0, 1 y muchas calificaciones.", esperado: "Sin calificaciones el score es nulo y el perfil es nuevo; una sola calificación de 5 queda cerca de la media global y nunca en 5,0; con muchas consistentes converge a la media real; una calificación vieja pesa menos que una reciente.", test: services/movo-svc-shipments/test/reputation.test.ts}
      - {ac: "7", titulo: "Perfil nuevo", pre: "Usuario con menos de 3 calificaciones, y con 3 o más.", pasos: "Consultar la reputación.", esperado: "isNewProfile es verdadero con menos de 3 (el score igual viaja) y falso con 3 o más, sin contaminar un rol nunca calificado.", test: [services/movo-svc-shipments/test/ratings.integration.test.ts, services/movo-svc-shipments/test/reputation.test.ts]}
      - {ac: "4", titulo: "Desglose por rol y conteos", pre: "Usuario con envíos como emisor, transportista y receptor.", pasos: "GET /internal/users/:id/reputation.", esperado: "Los conteos incluyen solo envíos delivered o completed, separados por rol; el desglose por rol y por categoría se informa solo si hay datos.", test: services/movo-svc-shipments/test/ratings.integration.test.ts}
      - {ac: "5", titulo: "Comentarios recientes", pre: "Usuario con calificaciones recibidas.", pasos: "GET /internal/users/:id/ratings/recent con y sin cursor.", esperado: "Devuelve las últimas calificaciones recibidas, paginadas con cursor, con el nombre de quien calificó.", test: [services/movo-svc-shipments/test/ratings.integration.test.ts, services/movo-svc-users/test/users.reputation.integration.test.ts]}
      - {ac: "2, 6", titulo: "Perfil con reputación e insignias", pre: "Perfil propio y perfil público.", pasos: "GET /users/me y GET /users/:id.", esperado: "Devuelve reputationScore, conteos, desglose por rol, isNewProfile y datos de miembro; si svc-shipments no responde, el perfil se devuelve igual con score nulo y contadores en cero.", test: services/movo-svc-users/test/users.reputation.integration.test.ts}
      - {ac: "-", titulo: "Conexiones en común", pre: "Dos usuarios con y sin envíos en común.", pasos: "Consultar las conexiones mutuas.", esperado: "Cuenta cada contraparte compartida una sola vez, en cualquier rol, sin incluir a los dos usuarios.", test: services/movo-svc-shipments/test/mutual-connections.integration.test.ts}

  - id: MOVO-175
    nombre: Reportar y bloquear usuarios
    secuencias:
      - {id: seq-moderacion, titulo: "Reporte con fotos y bloqueo entre usuarios (MOVO-175, MOVO-256, DD-026)."}
    nota: |
      **Alcance final.** La historia no tiene criterios de aceptación en Linear; su alcance quedó en el reporte con motivo, detalle y fotos (MOVO-256) y en el bloqueo bidireccional. El bloqueo no es simétrico en su efecto: oculta envíos y bloquea ofertas y designaciones en cualquier dirección, pero en el chat no impide escribir, solo oculta el contenido a quien tiene el bloqueo. Los reportes los revisa el equipo desde el panel de administración.
    casos:
      - {ac: "-", titulo: "Crear un reporte", pre: "Usuario autenticado y otro usuario.", pasos: "POST /users/:id/report con motivo y detalle.", esperado: "201 con el reporte en pending y el detalle recortado; no se puede reportar a uno mismo (400 CANNOT_MODERATE_SELF), a un usuario inexistente o dado de baja (404), ni con motivo inválido (400).", test: services/movo-svc-users/test/moderation.integration.test.ts}
      - {ac: "-", titulo: "Un reporte pendiente por par y cupo diario", pre: "Reporte ya en revisión; reportes del día.", pasos: "Reportar de nuevo y al pasar el máximo diario; dos reportes concurrentes.", esperado: "409 REPORT_ALREADY_PENDING sin consumir cupo; 429 RATE_LIMIT_EXCEEDED al pasar el máximo; dos reportes concurrentes del mismo par crean una sola fila.", test: services/movo-svc-users/test/moderation.integration.test.ts}
      - {ac: "-", titulo: "Entradas adicionales al reporte", pre: "Reporte propio en revisión.", pasos: "POST /users/:id/report/entries; consultar el reporte propio y el de un tercero.", esperado: "Suma entradas en orden sin editar el original; el usuario ve el reporte propio y nunca el de un tercero.", test: services/movo-svc-users/test/moderation.integration.test.ts}
      - {ac: "-", titulo: "Fotos del reporte", pre: "Fotos subidas, inexistentes o de otro usuario.", pasos: "Presignar, subir y adjuntar fotos al reporte.", esperado: "Solo JPEG de hasta 2 MB (se verifica el objeto real); una clave de otro usuario es 403 PHOTO_FORBIDDEN_KEY, una foto no subida 422, una reusada 409 REPORT_PHOTO_ALREADY_USED; una entrada puede ser solo fotos y no consume cupo extra.", test: services/movo-svc-users/test/moderation.photos.integration.test.ts}
      - {ac: "-", titulo: "Efectos del bloqueo en los envíos", pre: "Un bloqueo entre emisor o receptor y un transportista.", pasos: "Listar el feed, ofertar, aceptar y editar ofertas, designar receptor.", esperado: "El feed oculta el envío; 403 USER_BLOCKED en cualquier dirección al ofertar, aceptar, editar o designar; el emisor no ve ofertas de un bloqueado hechas antes. El feed falla abierto y crear una oferta falla cerrado (502 si users no responde).", test: services/movo-svc-shipments/test/block-relations.integration.test.ts}
      - {ac: "-", titulo: "Bloqueo en el chat", pre: "Un participante con un bloqueo hacia el autor.", pasos: "El autor escribe en el chat del envío.", esperado: "Escribir no se impide; quien tiene el bloqueo recibe el mensaje oculto y los demás lo ven normal.", test: services/movo-svc-shipments/test/chat.integration.test.ts}
