      - {ac: "-", titulo: "Interfaz del listado y del detalle", pre: "Panel con datos.", pasos: "Renderizar listado, detalle, panel de chat y de seguimiento.", esperado: "Se muestran pestañas, tabla, línea de tiempo y mapa con sus estados de carga y error.", test: [movo-admin/components/shipments/shipments-list.test.tsx, movo-admin/components/shipments/shipment-detail.test.tsx, movo-admin/components/shipments/chat-panel.test.tsx, movo-admin/components/shipments/tracking/tracking-panel.test.tsx]}

  - id: MOVO-30
    nombre: Disputa sobre un envío
    secuencias:
      - {id: seq-disputa, titulo: "Apertura de una disputa con fotos y carga de descargos (MOVO-30, MOVO-334)."}
    nota: |
      **Estado.** Historia en *Backlog* en Linear: el backend (MOVO-334: entidad, apertura, descargos, notificaciones y bloqueo del transportista) está terminado, pero falta la experiencia móvil (MOVO-335). **Decisión de diseño (ADR-054):** una disputa se abre sobre un envío `completed` o `delivered` dentro de los 7 días desde la entrega y no toca el hold, que ya fue capturado. La resolución por el administrador y los reembolsos están en backlog (ver MOVO-34).
    casos:
      - {ac: "-", titulo: "Apertura dentro de la ventana", pre: "Envío completed o delivered dentro de los 7 días.", pasos: "POST /shipments/:id/disputes con motivo y descripción.", esperado: "201 con la disputa abierta; el envío pasa a disputed sin tocar el hold. Quien no es parte (aunque sea admin) recibe 403.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Validaciones de la apertura", pre: "Disputa existente o datos inválidos.", pasos: "Abrir con motivo de sistema, sin descripción, o con otra disputa abierta.", esperado: "400 con motivo de sistema o sin descripción; 409 DISPUTE_ALREADY_OPEN con el id de la existente; pasar a disputed sin expediente no es posible.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Fotos del expediente", pre: "Fotos subidas, de otra parte o sin subir.", pasos: "Presignar y adjuntar fotos a la disputa.", esperado: "Las fotos se devuelven como URLs de lectura; 403 con la foto de otra parte, 422 si no se subió y 400 si pasa el tope de 4; solo las partes pueden presignar.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Descargos", pre: "Disputa abierta.", pasos: "Cada contraparte carga un descargo; quien abrió amplía; intentos extra; disputa ya resuelta.", esperado: "Cada contraparte carga un descargo y quien abrió amplía una vez, los extras son 409; en una disputa de sistema las tres partes cargan descargo y nadie amplía; 409 DISPUTE_NOT_OPEN si ya se resolvió.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Bloqueos asociados", pre: "Disputa abierta por una parte o por el sistema.", pasos: "Consultar el estado del transportista y la baja de cuenta.", esperado: "Una disputa de una parte bloquea al transportista (la de pickup_no_show no); toda disputa abierta bloquea la baja de cuenta de las tres partes.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Disputas de sistema por anomalías", pre: "Envío con anomalía de tránsito.", pasos: "Correr el barrido de anomalías.", esperado: "Crea la disputa de sistema de cada envío ya disputado, con el motivo según el evento.", test: [services/movo-svc-shipments/test/disputes.integration.test.ts, services/movo-svc-shipments/test/transit-anomaly-dispute.integration.test.ts, services/movo-svc-shipments/test/transit-anomaly-sweep.test.ts]}

  - id: MOVO-34
    nombre: Gestión y resolución de disputas por el administrador
    nota: |
      **Estado.** Historia en *Backlog*: sus tres tickets (reembolsos total y parcial en `svc-payments`, matriz de resolución y bandeja de disputas del panel) no están implementados. Los casos de prueba quedan definidos a partir de los criterios de aceptación pendientes.
    casos:
      - {ac: "1", titulo: "Detalle de la disputa resuelta por rol", pre: "Disputa resuelta.", pasos: "Abrir el detalle como ganador y como perdedor.", esperado: "Muestra resultado, razonamiento del admin y qué pasa con el dinero, en lenguaje simple según el rol.", test: [], resultado: Pendiente}
      - {ac: "2, 3", titulo: "Invitación a calificar y navegación de la push", pre: "Disputa resuelta a favor de una parte.", pasos: "Abrir el detalle y tocar la push dispute_resolved.", esperado: "Solo quien ganó ve la invitación a calificar; la push navega al detalle de la disputa.", test: [], resultado: Pendiente}
      - {ac: "4, 5", titulo: "Reembolsos y estado final", pre: "Reembolso total o parcial aprobado.", pasos: "Resolver la disputa.", esperado: "El reembolso aparece en el historial de pagos con su tipo propio y el estado «En disputa» se reemplaza por el estado final del envío.", test: [], resultado: Pendiente}

  - id: MOVO-35
    nombre: Métricas de oferta y demanda
    nota: |
      **Estado.** Historia en *Backlog*, sin tickets ni criterios de aceptación definidos. Queda fuera del alcance entregado. Hoy el motor de precios consume un contexto de demanda local (ofertas y transportistas por zona de retiro, tema Publicación), pero no hay una vista de métricas para el administrador.
    casos:
      - {ac: "-", titulo: "Métricas por ruta y región", pre: "Historia no implementada.", pasos: "Previsto: el administrador consulta oferta y demanda por ruta y región.", esperado: "Casos de prueba por definir al implementarse la historia.", test: [], resultado: Pendiente}

  - id: MOVO-319
    nombre: Soporte dentro de la aplicación
    secuencias:
      - {id: seq-soporte, titulo: "Consulta de soporte con o sin envío y respuesta del agente (MOVO-319, MOVO-320 a MOVO-324)."}
    nota: |
      **Estado.** Historia en *Backlog* en Linear, aunque el lado del usuario está terminado: modelo y API de conversaciones con tiempo real (MOVO-320), adjuntos de imágenes (MOVO-321) y la experiencia móvil (MOVO-324), junto con el prototipo de la bandeja del panel (MOVO-323). Sigue en curso la API de la bandeja para agentes (MOVO-322), de modo que hoy el panel trabaja con datos de prototipo. Las notas internas del agente nunca llegan al usuario por ningún canal.
    casos:
      - {ac: "1", titulo: "Crear una consulta con o sin envío", pre: "Usuario autenticado.", pasos: "POST /support/conversations sin envío, y con un envío propio en cualquier rol.", esperado: "201 con la consulta en open, su código SOP y el primer mensaje; con envío, se vincula el envío.", test: services/movo-svc-shipments/test/support.integration.test.ts}
      - {ac: "1", titulo: "Envío ajeno o inexistente", pre: "Envío del que no es parte, inexistente, o un admin que no es parte.", pasos: "Vincular el envío a la consulta.", esperado: "422 SUPPORT_SHIPMENT_NOT_PARTY con la misma respuesta para ajeno e inexistente (no se filtra qué ids existen); ni un admin vincula un envío ajeno.", test: services/movo-svc-shipments/test/support.integration.test.ts}
      - {ac: "1", titulo: "Idempotencia y validación", pre: "Reenvío del mismo clientMessageId, texto vacío, tema inválido o adjunto inexistente.", pasos: "Crear la consulta en cada caso.", esperado: "El reenvío da 200 con lo ya creado y dos pedidos simultáneos crean una sola consulta; el texto vacío, el tema inválido y el adjunto inexistente se rechazan; el lenguaje ofensivo se enmascara y se marca moderated.", test: services/movo-svc-shipments/test/support.integration.test.ts}
      - {ac: "2", titulo: "Listado de consultas y no leídas", pre: "Consultas de varios usuarios con respuestas del equipo.", pasos: "GET /support/conversations y marcar como leída.", esperado: "Solo las propias, la de actividad más reciente primero, con el contador de respuestas del equipo no leídas que baja a cero al leer; sin consultas, lista vacía.", test: services/movo-svc-shipments/test/support.integration.test.ts}
      - {ac: "2", titulo: "Estados y reapertura", pre: "Consulta resuelta, esperando al usuario o abierta.", pasos: "El usuario escribe de nuevo.", esperado: "Una resuelta se reabre, una que espera al usuario vuelve a open (sin contar como reapertura) y una abierta no cambia.", test: services/movo-svc-shipments/test/support-rules.test.ts}
      - {ac: "1", titulo: "Envíos vinculables", pre: "Usuario con envíos en distintos roles, incluso terminales.", pasos: "GET /support/shipments.", esperado: "Trae los envíos en cualquier rol con código, estado, ruta y rol, incluido uno cuya recepción el usuario transfirió; no trae ajenos.", test: services/movo-svc-shipments/test/support.integration.test.ts}
      - {ac: "4", titulo: "Adjuntos de imágenes", pre: "Imagen del usuario.", pasos: "Presignar, subir y adjuntar a un mensaje.", esperado: "Las imágenes viajan por URLs prefirmadas de S3, con las reglas de tipo y tamaño del servicio de adjuntos.", test: [services/movo-svc-shipments/test/support-attachments.integration.test.ts, services/movo-svc-shipments/test/support-attachments.service.test.ts]}
      - {ac: "5, 6, 7", titulo: "Bandeja del agente", pre: "Agente con rol ADMIN.", pasos: "Operar la bandeja: tomar, asignar, cambiar prioridad, dejar notas internas, usar respuestas rápidas.", esperado: "API de la bandeja pendiente de implementación (MOVO-322); el prototipo del panel renderiza lista, conversación, composer y panel de contexto.", test: [movo-admin/components/support/conversation-list.test.tsx, movo-admin/components/support/thread/thread-view.test.tsx, movo-admin/components/support/thread/composer.test.tsx, movo-admin/components/support/context-panel.test.tsx]}

