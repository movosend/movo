  - id: MOVO-329
    nombre: Corrección manual del estado de un envío
    nota: |
      **Estado.** Historia terminada en el Sprint 8: endpoint interno de transición forzada en `svc-shipments` (MOVO-331), ruta de `svc-admin` con re-autenticación por OTP por acción, conflicto de interés y bitácora (MOVO-332) y modal del panel (MOVO-333). **Decisión de diseño (DD-055, propuesta):** la matriz de transiciones vive en `@movo/shared` y la leen el backend y el panel; solo se permiten aristas que ya tienen un servicio de dominio, y nunca se fuerza hacia *en tránsito*, *entregado* ni *en disputa*. El documento aparte con la matriz y los riesgos (MOVO-330) sigue pendiente y la propia DD-055 espera la revisión de dos integrantes.
    casos:
      - {ac: "4, 5, 6", titulo: "Transición forzada en svc-shipments", pre: "Envío trabado.", pasos: "Ejecutar la transición forzada desde el endpoint interno.", esperado: "Se ejecuta con los mismos efectos que la transición normal y queda en la línea de tiempo marcada como forzada; una transición fuera de la matriz se rechaza.", test: [services/movo-svc-shipments/test/admin-internal.integration.test.ts, services/movo-svc-shipments/test/force-status.integration.test.ts, services/movo-svc-shipments/test/forced-transition-matrix.test.ts, shared/movo-shared/test/forced-transition-matrix.test.ts]}
      - {ac: "1, 2, 3, 7", titulo: "Confirmaciones y re-autenticación del panel", pre: "Admin en el panel.", pasos: "Elegir un cambio de estado de riesgo alto o crítico.", esperado: "Exige motivo, código del envío tipeado y un OTP nuevo; muestra antes qué se ejecuta y a quién se avisa.", test: [services/movo-svc-admin/test/shipment-status.integration.test.ts, movo-admin/components/shipments/status-change/status-change.test.tsx, movo-admin/components/shipments/status-change/use-status-change.test.tsx]}

  - id: MOVO-224
    nombre: Legal y compliance (Términos, Privacidad y Ley 25.326)
    nota: |
      **Estado.** Historia con un ticket abierto, la mecánica de penalidades y los Términos y Condiciones asociados (MOVO-226 y MOVO-316, en el Cycle 10; ver el tema Pagos y Economía). El checkbox de aceptación legal en el registro (MOVO-228) está implementado; su último estado conocido es *En revisión*, y el ticket ya no figura en el export de Linear del 03/11/2026. Incluye la confirmación de la tasa de Mercado Pago para los Términos (MOVO-225), la re-aceptación de los Términos al abrir la app (MOVO-229) y el job de purga y anonimización de datos vencidos (MOVO-230). La historia no tiene criterios de aceptación en Linear.
