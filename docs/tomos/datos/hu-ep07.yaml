    nombre: Corrección manual del estado de un envío
    nota: |
      **Estado.** Historia en *Backlog*. El ticket MOVO-331 (endpoint interno de transición forzada) figura como terminado en Linear, pero no se encontró su código ni sus pruebas en la rama de integración usada para elaborar este documento, por lo que se lo trata como no verificado. Faltan el ADR con la matriz de transiciones y los riesgos (MOVO-330), la ruta de `svc-admin` con re-autenticación por OTP (MOVO-332) y el modal del panel (MOVO-333).
