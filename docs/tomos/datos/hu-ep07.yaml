  - id: MOVO-30
    nombre: Disputa sobre un envío
    secuencias:
      - {id: seq-disputa, titulo: "Apertura de una disputa con fotos y carga de descargos (MOVO-30, MOVO-334)."}
    nota: |
      **Estado.** Historia en *Backlog* en Linear: el backend (MOVO-334: entidad, apertura, descargos, notificaciones y bloqueo del transportista) está terminado y la resolución por el administrador también (MOVO-34), pero falta la experiencia móvil para abrir la disputa y cargar descargos (MOVO-335), de modo que hoy una parte no puede iniciar el reclamo desde la aplicación; las disputas abiertas por el sistema (no-retiro y tránsito demorado) sí se ven y se resuelven. **Decisión de diseño (DD-054):** una disputa se abre sobre un envío `completed` o `delivered` dentro de los 7 días desde la entrega y no toca el hold, que ya fue capturado. La resolución por el administrador y los reembolsos están en MOVO-34.
    casos:
      - {ac: "-", titulo: "Apertura dentro de la ventana", pre: "Envío completed o delivered dentro de los 7 días.", pasos: "POST /shipments/:id/disputes con motivo y descripción.", esperado: "201 con la disputa abierta; el envío pasa a disputed sin tocar el hold. Quien no es parte (aunque sea admin) recibe 403.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Validaciones de la apertura", pre: "Disputa existente o datos inválidos.", pasos: "Abrir con motivo de sistema, sin descripción, o con otra disputa abierta.", esperado: "400 con motivo de sistema o sin descripción; 409 DISPUTE_ALREADY_OPEN con el id de la existente; pasar a disputed sin expediente no es posible.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Fotos del expediente", pre: "Fotos subidas, de otra parte o sin subir.", pasos: "Presignar y adjuntar fotos a la disputa.", esperado: "Las fotos se devuelven como URLs de lectura; 403 con la foto de otra parte, 422 si no se subió y 400 si pasa el tope de 4; solo las partes pueden presignar.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Descargos", pre: "Disputa abierta.", pasos: "Cada contraparte carga un descargo; quien abrió amplía; intentos extra; disputa ya resuelta.", esperado: "Cada contraparte carga un descargo y quien abrió amplía una vez, los extras son 409; en una disputa de sistema las tres partes cargan descargo y nadie amplía; 409 DISPUTE_NOT_OPEN si ya se resolvió.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Bloqueos asociados", pre: "Disputa abierta por una parte o por el sistema.", pasos: "Consultar el estado del transportista y la baja de cuenta.", esperado: "Una disputa de una parte bloquea al transportista (la de pickup_no_show no); toda disputa abierta bloquea la baja de cuenta de las tres partes.", test: services/movo-svc-shipments/test/disputes.integration.test.ts}
      - {ac: "-", titulo: "Disputas de sistema por anomalías", pre: "Envío con anomalía de tránsito.", pasos: "Correr el barrido de anomalías.", esperado: "Crea la disputa de sistema de cada envío ya disputado, con el motivo según el evento.", test: [services/movo-svc-shipments/test/disputes.integration.test.ts, services/movo-svc-shipments/test/transit-anomaly-dispute.integration.test.ts, services/movo-svc-shipments/test/transit-anomaly-sweep.test.ts]}

  - id: MOVO-34
    nombre: Gestión y resolución de disputas por el administrador
    nota: |
      **Estado.** Historia terminada en el Sprint 8 en lo que corresponde al administrador y al backend: bandeja y expediente de disputas en el panel (MOVO-338, 341, 343), matriz de resolución (MOVO-337) y reembolsos total y parcial en `svc-payments` con respaldo en la cuenta corriente del transportista (MOVO-336). **Decisión de diseño (DD-056, propuesta):** la resolución no agrega estados al envío (cancelado si gana el emisor; completado si gana el transportista o es parcial), compensa por la cuenta corriente cuando no hay dinero para mover contra Mercado Pago y es **definitiva**; si el pago falla, la disputa queda en *procesando* y se reintenta. Los casos que dependen de la pantalla de detalle de la disputa en la aplicación móvil (criterios 1 a 3) siguen pendientes porque esa experiencia es MOVO-335, en *Backlog*.
    casos:
      - {ac: "-", titulo: "Matriz de resolución y estado final", pre: "Disputa abierta sobre un envío asignado, en tránsito, entregado o completado.", pasos: "Resolver a favor del emisor, del transportista y de forma parcial en cada estado.", esperado: "El pago sigue la matriz (nada, liberar, capturar, reembolsar o crédito en la cuenta corriente); el envío termina cancelado si gana el emisor y completado en los otros casos; el transportista se desbloquea; una resolución ya dada es definitiva.", test: [shared/movo-shared/test/dispute-resolution.test.ts, services/movo-svc-shipments/test/dispute-resolution.integration.test.ts]}
      - {ac: "-", titulo: "Reembolso total, parcial y respaldo", pre: "Pago capturado de un envío.", pasos: "Reembolsar total y parcialmente; reintentar con la misma clave; reembolsar más de lo reembolsable; simular una falla del proveedor.", esperado: "El reembolso es idempotente y no supera lo reembolsable; si el transportista no tiene saldo en Mercado Pago, el reembolso queda en respaldo a la cuenta corriente: se asienta su deuda, no se vuelve a reintentar contra Mercado Pago y se alerta al equipo.", test: [services/movo-svc-payments/test/refunds.integration.test.ts, services/movo-svc-payments/test/refund-failure.test.ts]}
      - {ac: "-", titulo: "Resolución desde el panel", pre: "Administrador que no es parte del envío.", pasos: "Resolver una disputa desde svc-admin con un razonamiento y, en el parcial, un porcentaje o un monto.", esperado: "Valida el razonamiento y el reparto, previsualiza el efecto, rechaza la resolución de un administrador en conflicto de interés y la deja en la bitácora.", test: [services/movo-svc-admin/test/disputes.integration.test.ts, services/movo-svc-admin/test/conflict-of-interest.test.ts]}
      - {ac: "-", titulo: "Bandeja y expediente del panel", pre: "Disputas abiertas y resueltas.", pasos: "Listar con filtros y contadores, abrir el expediente y cargar notas internas.", esperado: "La bandeja filtra y cuenta por estado; el expediente reúne descargos, handshake, fotos, historial de las partes y notas.", test: [services/movo-svc-shipments/test/admin-disputes-read.integration.test.ts, movo-admin/components/disputes/disputes.test.tsx, movo-admin/lib/disputes/resolution.test.ts, movo-admin/lib/disputes/params.test.ts]}
      - {ac: "1", titulo: "Detalle de la disputa resuelta por rol", pre: "Disputa resuelta.", pasos: "Abrir el detalle como ganador y como perdedor.", esperado: "Muestra resultado, razonamiento del admin y qué pasa con el dinero, en lenguaje simple según el rol.", test: [], resultado: Pendiente}
      - {ac: "2, 3", titulo: "Invitación a calificar y navegación de la push", pre: "Disputa resuelta a favor de una parte.", pasos: "Abrir el detalle y tocar la push dispute_resolved.", esperado: "Solo quien ganó ve la invitación a calificar; la push navega al detalle de la disputa.", test: [], resultado: Pendiente}
      - {ac: "4, 5", titulo: "Reembolsos y estado final", pre: "Reembolso total o parcial aprobado.", pasos: "Resolver la disputa.", esperado: "El reembolso aparece en el historial de pagos con su tipo propio y el estado «En disputa» se reemplaza por el estado final del envío.", test: [], resultado: Pendiente}

  - id: MOVO-35
    nombre: Métricas de oferta y demanda
    nota: |
      **Estado.** La historia figura *En curso* en Linear (Cycle 10), pero el backend y las pantallas ya están en `develop`: los reportes del panel (MOVO-342, 344 y 345, que no tienen historia padre propia, por lo que se documentan acá) y las otras pestañas de **Métricas** (cashflow, precio y volumen, entregas, transportistas, distancias y soporte), con **Inicio** como resumen operativo de ocho bandejas con su plazo y **Bitácora** auditable. **Decisiones de diseño:** los agregados los calcula el servicio dueño del dato y `svc-admin` solo valida el rango, orquesta y arma el CSV (ADR-025); las reglas de cada métrica (distancia por tramos, efectivo dentro del GMV, motivo de demora, puente del GMV como atribución aproximada, *take rate* y tasa de disputas) están en DD-059, propuesta registrada en el repositorio (`docs/decisiones`) y todavía no pasada al Registro de Decisiones de Diseño. **Limitación aceptada:** el puente del GMV es una atribución aproximada, y los envíos anteriores a la distancia persistida caen enteros en «otros». Queda abierta la verificación de la historia contra dev.
    casos:
      - {ac: "-", titulo: "Rango de fechas de los reportes", pre: "Rangos válidos, invertidos o mayores a 366 días.", pasos: "Pedir un reporte y su CSV con cada rango.", esperado: "400 REPORT_RANGE_INVALID con el motivo; el rango se valida una sola vez, también en el export; la granularidad (día, semana o mes) sigue el largo del rango.", test: [shared/movo-shared/test/admin-reports.test.ts, services/movo-svc-admin/test/reports.integration.test.ts, movo-admin/lib/reports/range.test.ts]}
