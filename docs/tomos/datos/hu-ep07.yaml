      - {ac: "1, 2, 3, 7", titulo: "Confirmaciones y re-autenticación del panel", pre: "Admin en el panel.", pasos: "Elegir un cambio de estado de riesgo alto o crítico.", esperado: "Exige motivo, código del envío tipeado y un OTP nuevo; muestra antes qué se ejecuta y a quién se avisa.", test: [], resultado: Pendiente}

  - id: MOVO-224
