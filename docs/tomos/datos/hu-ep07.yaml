      - {ac: "-", titulo: "Detalle y chat del envío", pre: "Envío con chat.", pasos: "Consultar el detalle y el chat desde el panel.", esperado: "El detalle trae partes, ciudades, precio, avisos y fechas límite; el administrador lee el chat aun cancelado y nunca escribe.", test: [services/movo-svc-admin/test/shipments.integration.test.ts, services/movo-svc-shipments/test/chat.integration.test.ts]}
