# EP-07 · Gestión y Administración: historias, secuencias y casos de prueba.
historias:
  - id: MOVO-286
    nombre: Acceso al panel con segundo factor
    secuencias:
      - {id: seq-acceso-admin, titulo: "Ingreso al panel con OTP por email, sesión de 8 horas y bitácora de acciones (MOVO-286, MOVO-287 a MOVO-292)."}
    nota: |
      **Decisión de diseño.** El panel tiene su propia sesión, separada de la de la app: el ingreso exige contraseña más un código de un solo uso por email, el access token dura 15 minutos con una sesión máxima de 8 horas, y un token de la app nunca lleva el rol `admin` aunque el usuario lo tenga. Toda escritura desde el panel pasa por `movo-svc-admin`, que aplica la regla de conflicto de interés y deja una bitácora de solo agregar filas.
    casos:
      - {ac: "1", titulo: "Paso 1: credenciales y código por email", pre: "Usuario con rol admin, email verificado y cuenta activa.", pasos: "POST /auth/admin/login con email o con teléfono.", esperado: "El código sale por email y nunca se emiten tokens; el teléfono (formato de la app) también se acepta.", test: services/movo-svc-users/test/auth.admin-session.integration.test.ts}
      - {ac: "2", titulo: "Rechazo sin revelar la causa", pre: "Usuario sin rol admin, con cuenta suspendida, con credenciales inválidas o con teléfono desconocido.", pasos: "POST /auth/admin/login en cada caso.", esperado: "Las cuatro causas responden el mismo 401 y no envían ningún mail; un body sin email ni teléfono se rechaza.", test: services/movo-svc-users/test/auth.admin-session.integration.test.ts}
      - {ac: "1, 3, 4", titulo: "Paso 2: sesión del panel", pre: "Código válido recibido.", pasos: "POST /auth/admin/verify con el código.", esperado: "Se emite un access token de 15 minutos con el rol admin y una sesión de 8 horas; el mismo admin entra a la app sin el rol admin; el código es de un solo uso.", test: services/movo-svc-users/test/auth.admin-session.integration.test.ts}
      - {ac: "2", titulo: "Código incorrecto o de otro flujo", pre: "Desafío vigente.", pasos: "Verificar con un código erróneo hasta cinco veces, con un otpId ajeno, o tras perder el rol entre los dos pasos.", esperado: "401; al quinto error el desafío se invalida; un otpId de otro flujo no abre sesión; si pierde el rol, el 401 es genérico.", test: services/movo-svc-users/test/auth.admin-session.integration.test.ts}
      - {ac: "4", titulo: "Refresh separado y con rotación", pre: "Sesión de panel y sesión de app.", pasos: "Refrescar cada una en la ruta contraria; refrescos concurrentes; cerrar sesión.", esperado: "Un refresh de panel no sirve en /auth/refresh ni uno de la app en /auth/admin/refresh; las solicitudes concurrentes comparten una sola rotación y la revocación impide devolver el resultado compartido.", test: services/movo-svc-users/test/auth.admin-session.integration.test.ts}
      - {ac: "3", titulo: "Confirmación de acceso desde svc-admin", pre: "Pedidos con y sin rol admin.", pasos: "Consultar la sesión en svc-admin.", esperado: "Sin identidad, 401; sin rol admin, 403; con rol admin confirma el acceso sin tokens ni caché.", test: services/movo-svc-admin/test/session.test.ts}
      - {ac: "6", titulo: "Bitácora de acciones", pre: "Acciones del admin con resultados distintos.", pasos: "Ejecutar acciones exitosas, rechazadas, con error inesperado y con el servicio dueño caído.", esperado: "Quedan registradas como succeeded, failed o unknown (nunca succeeded si el servicio no respondió); la tabla solo admite agregar filas (UPDATE y DELETE fallan); sin identidad, 401.", test: services/movo-svc-admin/test/audit.integration.test.ts}
      - {ac: "6", titulo: "Regla de conflicto de interés", pre: "Admin que actúa sobre sí mismo, sobre su rol o sobre un envío del que es parte.", pasos: "Intentar la acción.", esperado: "No ejecuta la acción y deja el intento como failed (403 ADMIN_CONFLICT_OF_INTEREST); sobre otro usuario o un envío ajeno sí puede; si svc-shipments no responde, falla cerrado con 502.", test: [services/movo-svc-admin/test/conflict-of-interest.test.ts, services/movo-svc-admin/test/audit.integration.test.ts]}
      - {ac: "8", titulo: "Gestión de administradores", pre: "Admin autenticado.", pasos: "Listar, otorgar y revocar el rol admin; revocarse a sí mismo; revocar al último admin.", esperado: "Se listan los admins y se autocompletan candidatos; revocar exige motivo; revocarse es 403; no se deja al sistema sin admins; otorgar y revocar dejan filas en la bitácora con el x-request-id del gateway.", test: [services/movo-svc-admin/test/admins.integration.test.ts, services/movo-svc-users/test/admins.integration.test.ts]}

  - id: MOVO-293
    nombre: Búsqueda de usuarios y ficha completa
    casos:
      - {ac: "1", titulo: "Búsqueda y paginación", pre: "Cuentas con distintos datos, incluidas las dadas de baja.", pasos: "Buscar por nombre, email, DNI y teléfono.", esperado: "Sin consulta lista todas, las más recientes primero; la búsqueda no distingue tildes ni mayúsculas, acepta DNI con o sin puntos desde 3 dígitos y teléfonos en los formatos del login; pagina y devuelve el total.", test: [services/movo-svc-users/test/admin-users.integration.test.ts, services/movo-svc-admin/test/users.integration.test.ts]}
      - {ac: "2, 3, 4, 5", titulo: "Ficha completa", pre: "Usuario con actividad.", pasos: "GET /admin/users/:id y sus secciones (kyc, shipments, trips, ratings, ledger, devices, moderation).", esperado: "La ficha devuelve el perfil completo (también de una cuenta dada de baja); KYC suma la tarjeta de Mercado Pago; los envíos y calificaciones traen el nombre de las partes; la cuenta corriente trae el saldo total y el nombre del admin que ajustó.", test: services/movo-svc-admin/test/users.integration.test.ts}
      - {ac: "9, 10", titulo: "Secciones independientes y lectura sin bitácora", pre: "Un servicio caído.", pasos: "Consultar la ficha con svc-shipments o svc-payments caído.", esperado: "La ficha responde igual: con svc-shipments caído las secciones de envíos, viajes y calificaciones son 502; con svc-payments caído la cuenta corriente es 502 y KYC responde sin la tarjeta; las lecturas no dejan filas en la bitácora.", test: services/movo-svc-admin/test/users.integration.test.ts}
      - {ac: "-", titulo: "Interfaz del panel", pre: "Ficha cargada en el panel.", pasos: "Renderizar buscador, encabezado, actividad, listas largas, notas y acciones de cuenta.", esperado: "Cada sección carga por separado y muestra su propio error sin romper el resto.", test: [movo-admin/components/users/user-search.test.tsx, movo-admin/components/users/user-header.test.tsx, movo-admin/components/users/section-error.test.tsx, movo-admin/components/users/sections/activity-panel.test.tsx]}

  - id: MOVO-36
    nombre: Suspensión e inhabilitación de cuentas
    secuencias:
      - {id: seq-sancionar-cuenta, titulo: "Aplicación, efecto inmediato y levantamiento de una sanción de cuenta (MOVO-36, MOVO-296 a MOVO-300)."}
    nota: |
      **Estado.** Historia en curso: el backend (sanciones en `svc-users`, efectos en `svc-shipments`, bloqueo en el gateway) y la experiencia móvil están terminados; falta la pantalla del panel para aplicar y levantar sanciones (MOVO-299). La sanción se aplica contra la API interna de `svc-users`. **Decisión de diseño:** el estado de la cuenta vive en una marca en Redis que el gateway consulta en cada request, de modo que el efecto es inmediato aun con un token ya emitido; el historial en Postgres es de solo agregar filas.
    casos:
      - {ac: "1, 10", titulo: "Suspender con y sin fecha de fin", pre: "Usuario activo.", pasos: "POST /internal/users/:id/sanctions con tipo suspension, con y sin fin.", esperado: "Queda la fila en el historial, la caché en el usuario y la marca en Redis con TTL hasta el fin (o sin TTL si es indefinida).", test: services/movo-svc-users/test/sanctions.integration.test.ts}
      - {ac: "5", titulo: "Inhabilitar", pre: "Usuario activo o suspendido.", pasos: "Inhabilitar; inhabilitar a un suspendido; inhabilitar a un inhabilitado.", esperado: "La cuenta pasa a banned con marca sin TTL y se revocan las sesiones de la app y del panel; inhabilitar a un suspendido escala la sanción; sobre un inhabilitado, 409.", test: services/movo-svc-users/test/sanctions.integration.test.ts}
      - {ac: "1", titulo: "Validación de la sanción", pre: "Pedido incompleto.", pasos: "Sancionar sin motivo, con fin en el pasado o con fin en una inhabilitación.", esperado: "400 por motivo obligatorio, fin futuro requerido y la inhabilitación no lleva fin; suspender a alguien ya suspendido reemplaza la sanción vigente y cierra la anterior.", test: services/movo-svc-users/test/sanctions.integration.test.ts}
      - {ac: "2, 3, 5", titulo: "Efecto inmediato en el gateway", pre: "Cuenta suspendida o inhabilitada con un token ya emitido.", pasos: "Hacer una request que inicia una acción nueva, y otra de lectura.", esperado: "403 ACCOUNT_SUSPENDED (con endsAt) o ACCOUNT_DISABLED en las acciones que inician algo; las lecturas pasan; una marca vencida por TTL deja de bloquear; si Redis no responde, el gateway falla abierto.", test: gateway/test/account-restriction.test.ts}
      - {ac: "2, 5", titulo: "Login y refresh de una cuenta sancionada", pre: "Cuenta suspendida y cuenta inhabilitada.", pasos: "Iniciar sesión y refrescar.", esperado: "Un suspendido puede loguearse y refrescar; un inhabilitado no. Una suspensión vencida que el barrido no cerró se trata como activa en cualquier lectura.", test: services/movo-svc-users/test/sanctions.integration.test.ts}
      - {ac: "4, 6", titulo: "Efectos sobre los envíos", pre: "Usuario con publicaciones, ofertas, viajes y envíos en curso.", pasos: "Aplicar la sanción.", esperado: "Se retiran lo publicado, las ofertas y los viajes sin paquetes y se cancelan los envíos que esperan al receptor; lo comprometido o en tránsito no se toca; las contrapartes de los envíos en curso reciben un aviso genérico sin el motivo; es idempotente.", test: services/movo-svc-shipments/test/sanction-effects.integration.test.ts}
      - {ac: "6, 8, 9", titulo: "Avisos, vencimiento y levantamiento", pre: "Sanción vigente.", pasos: "Aplicar, vencer y levantar.", esperado: "Se avisa por push y email con el motivo y el plazo (nunca la nota interna); una suspensión vencida la levanta el barrido con aviso; levantar una sanción la cierra con motivo y deja la cuenta activa; levantar una inexistente o ajena es 404.", test: services/movo-svc-users/test/sanctions.integration.test.ts}
      - {ac: "11", titulo: "Sanciones a administradores", pre: "Un admin como objetivo.", pasos: "Sancionar a un admin y al último admin elegible.", esperado: "Se le cortan las sesiones de panel; no se puede sancionar al último admin; la marca se reescribe si Redis perdió datos y al arrancar el servicio.", test: services/movo-svc-users/test/sanctions.integration.test.ts}
      - {ac: "-", titulo: "Pantalla del panel", pre: "Panel con la ficha de un usuario.", pasos: "Renderizar las acciones de cuenta.", esperado: "Muestra las acciones de suspender, inhabilitar y levantar con motivo obligatorio.", test: [movo-admin/components/users/actions/account-actions.test.tsx, "movo-admin/app/users/[id]/account-actions.test.ts"], resultado: Pendiente}

  - id: MOVO-33
    nombre: Monitoreo de envíos desde el panel
    casos:
