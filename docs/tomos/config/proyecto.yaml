subtitulo: Plataforma de logística colaborativa P2P
lema: Logística para personas
sitio: movosend.app
metodologia: Scrum (marco ágil iterativo, sprints de dos semanas gestionados en Linear)
objetivo: >-
  Desarrollar una plataforma de logística distribuida peer-to-peer que permita a cualquier
  persona enviar un paquete a través de otra persona que ya realiza ese recorrido, con
  seguridad verificable sobre la identidad de las partes, la transferencia de custodia y el
  pago, sin depender de un intermediario logístico centralizado.
ambito: >-
  Producto de software (proyecto independiente, sin organización cliente). Logística
  colaborativa de paquetes entre particulares, con foco en localidades del interior de
  Argentina.
