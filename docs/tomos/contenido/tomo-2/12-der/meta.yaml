introduccion: |
  Este documento presenta el modelo de datos de Movo: un diagrama entidad-relación por cada grupo
  de tablas, la lista de tablas con su propósito, los tipos enumerados y el diccionario de datos
  de cada tabla. Se genera automáticamente desde los esquemas Prisma de cada servicio.
audiencia: |
  El tribunal evaluador y los futuros mantenedores, con conocimiento de bases de datos relacionales.
