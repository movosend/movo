introduccion: |
  Este documento presenta el modelo de datos de Movo: un diagrama entidad-relación por cada grupo
  de tablas, la lista de tablas con su propósito, los tipos enumerados y los campos clave.
  El diccionario completo se conserva como anexo digital. Ambos se generan desde los
  esquemas Prisma de cada servicio.
audiencia: |
  El tribunal evaluador y los futuros mantenedores, con conocimiento de bases de datos relacionales.
