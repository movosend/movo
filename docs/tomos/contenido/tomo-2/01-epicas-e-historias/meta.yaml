introduccion: |
  Este documento lista las épicas y las historias de usuario de Movo en su versión vigente, con el
  estado real de cada una al momento de la entrega. Es el índice del resto del tomo: cada épica da
  lugar a un tema con la trazabilidad detallada de sus historias.
audiencia: |
  El tribunal evaluador y los futuros mantenedores, que necesitan ubicar rápidamente qué
  funcionalidad existe, en qué estado está y dónde se documenta.
