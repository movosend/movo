introduccion: |
  Este documento presenta la trazabilidad de las historias de usuario del tema *Asignación y
  Negociación*: para cada historia, su descripción y criterios de aceptación, los tickets que la
  implementaron, el diagrama de secuencia que muestra cómo la resuelve el sistema y los casos de
  prueba que la verifican.
audiencia: |
  El tribunal evaluador y los futuros mantenedores. Se asume conocimiento de las
  convenciones del proyecto y de UML.
