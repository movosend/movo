introduccion: |
  La jornada de presentación comunica el proyecto a la comunidad académica: el paper argumenta,
  el póster comunica visualmente y el video demuestra. Este documento reúne el póster, la ficha
  de herramientas y tecnologías que acompaña a la presentación y el apartado del video.
audiencia: |
  Comunidad académica, docentes, jurado y visitantes.
