introduccion: |
  Este documento reúne el paper del proyecto Movo, elaborado según las normas previstas por la
  cátedra para la jornada de presentación de proyectos. El paper argumenta: plantea el problema
  de la exclusión logística, describe la solución y la metodología, presenta los resultados,
  discute sus límites y concluye. Se acompaña del póster y del video en el documento siguiente.

  Se incluye la versión original, corregida solo en los puntos técnicos que cambiaron durante el
  desarrollo posterior a la jornada; los cambios se listan al final.
audiencia: |
  Comunidad académica, docentes, jurado y visitantes de la jornada. No se asume conocimiento
  técnico profundo del sistema.
