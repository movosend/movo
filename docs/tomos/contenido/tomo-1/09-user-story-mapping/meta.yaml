instancia: Instancia 2 · Sprint 0
version: "2.2"
fecha: 07/11/2026
historial:
  - {version: "1", fecha: 06/05/2026, autor: Equipo completo, descripcion: Creación de la versión inicial del documento.}
  - {version: "2", fecha: 30/05/2026, autor: Equipo completo, descripcion: Estimación inicial completa de las historias de usuario y cálculo de la estimación global en horas del proyecto.}
