introduccion: |
  Este documento visualiza el recorrido del usuario en Movo y organiza el trabajo con criterio
  de valor. Incluye el *User Story Map* (actividades del usuario, tareas por actividad y corte
  de MVP) y el *Product Backlog* inicial: las épicas y las historias de usuario priorizadas,
  con su prioridad y estimación inicial. Los criterios refinados y la trazabilidad se
  desarrollan en el Tomo II.

  El glosario del dominio que acompañaba a este documento en el Sprint 0 se consolidó, junto con
  los términos técnicos, en el glosario del Tomo II.
audiencia: |
  El equipo, para planificar los sprints, y el Product Owner, para gestionar el backlog. Los
  docentes lo usan para verificar el valor y la priorización del alcance.
