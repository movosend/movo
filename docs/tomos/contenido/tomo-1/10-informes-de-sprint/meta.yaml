introduccion: |
  Los Informes de Sprint registran qué planificó el equipo en cada sprint, qué logró, qué
  aprendió y cómo va a mejorar. Son el insumo principal para evaluar el *proceso* de desarrollo
  y no solamente el producto. Este documento reúne los informes de todos los sprints del
  proyecto en orden cronológico, precedidos de un resumen comparativo.

  Cada informe fue redactado al cierre de su sprint por el Scrum Master de turno (rol rotativo).
  Esta edición abrevia tablas repetidas para el tomo; los informes íntegros, sin edición,
  están en `docs/tomos/anexos/sprints/`.
audiencia: |
  El equipo, para mejorar, y los docentes, para evaluar el proceso. Se asume conocimiento del
  Plan de Proyecto (técnica de estimación y métricas de seguimiento) y del Working Agreement.
