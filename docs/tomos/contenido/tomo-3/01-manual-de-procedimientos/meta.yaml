introduccion: |
  Este manual describe cómo funciona el proceso de negocio de Movo con el sistema integrado y cómo
  debe actuar el equipo ante las situaciones que requieren intervención humana. Detalla los roles, el
  proceso de punta a punta, los plazos y reglas vigentes, los procedimientos de administración y las
  contingencias.
audiencia: |
  El equipo de operaciones y soporte de Movo, los administradores del panel y el equipo de
  desarrollo. También sirve al tribunal evaluador para comprender el funcionamiento operativo.
