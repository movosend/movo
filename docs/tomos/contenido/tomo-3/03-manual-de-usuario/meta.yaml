introduccion: |
  Este manual explica cómo usar Movo: la aplicación móvil para quienes envían, reciben o transportan
  paquetes y el panel de administración para el equipo que opera la plataforma. Está organizado por
  tareas y por rol, e incluye la lista de capturas de pantalla que ilustran cada paso.
audiencia: |
  Los usuarios finales de la aplicación (emisores, receptores y transportistas) y los
  administradores del panel. No se requieren conocimientos técnicos.
