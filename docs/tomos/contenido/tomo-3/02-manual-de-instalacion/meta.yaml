introduccion: |
  Este manual explica cómo instalar, desplegar y operar Movo: el entorno local, los ambientes en
  AWS, los frontends, las tareas de operación y el diagnóstico de problemas frecuentes. Incluye un
  apéndice con las variables de entorno de cada servicio.
audiencia: |
  El equipo de desarrollo y de operaciones de Movo, y quien despliegue o mantenga la plataforma,
  con conocimientos de administración de Linux, Docker y bases de datos.
